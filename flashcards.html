e models","q":"Who manages what under IaaS, PaaS and SaaS (Fig 13.2)?","a":["IaaS: customer manages applications, data, runtime, middleware and OS.","PaaS: customer manages applications and data only.","SaaS: provider manages everything."],"d":"In all three, the provider manages virtualisation, servers, storage and network. Higher up = provider manages MORE, you control LESS.","r":"CH13 S18, S32"},{"c":13,"t":"Deployment models and actors","q":"What are the four cloud deployment models?","a":["Private: one organisation, the MOST secure. Public: open to anyone using that provider. Hybrid: public and private together. Community: shared by organisations with common interests."]},{"c":13,"t":"Deployment models and actors","q":"How do the deployment models compare on scalability, security and cost (Table 13.1)?","a":["Private: limited scalability, most secure, high cost. Community: limited scalability, very secure, medium cost. Public: very high scalability, moderately secure, low cost. Hybrid: very high scalability, very secure, medium cost."],"r":"CH13 S19"},{"c":13,"t":"Deployment models and actors","q":"Who are the five actors in the cloud reference architecture (Fig 13.4)?","a":["Cloud consumer, cloud provider, carrier (the network link), broker (intermediary), auditor."]},{"c":13,"t":"Cloud security issues","q":"Who is responsible for what in cloud security?","a":["Cloud USERS remain responsible for application-level security. Cloud VENDORS are responsible for physical security and some software security. The intermediate layers of the stack are SHARED responsibility."]},{"c":13,"t":"Cloud security issues","q":"What must cloud providers guard against?","a":["Theft and DoS by their own users, and users harming one another."]},{"c":13,"t":"Cloud security issues","q":"What areas does the NIST guideline summary (Table 13.2) cover?","a":["Governance, compliance, trust, architecture, identity and access management, software isolation, data protection, availability, incident response."],"r":"CH13 S21"},{"c":13,"t":"CSA top threats","q":"List the seven CSA cloud threats in order.","a":["1. Abuse and nefarious use of cloud computing. 2. Insecure interfaces and APIs. 3. Malicious insiders. 4. Shared technology issues. 5. Data loss or leakage. 6. Account or service hijacking. 7. Unknown risk profile."],"n":"The friend's notes only listed four of the seven."},{"c":13,"t":"CSA top threats","q":"What are the countermeasures for abuse and nefarious use of cloud computing?","a":["Stricter initial registration and validation; enhanced credit-card fraud monitoring and coordination; comprehensive inspection of customer network traffic; monitoring public blacklists for one's own network blocks."],"r":"CH13 S24"},{"c":13,"t":"CSA top threats","q":"What are the countermeasures for insecure interfaces and APIs?","a":["Analyse the CSP interface security model; strong authentication, access control and encryption; understand the API dependency chain."]},{"c":13,"t":"CSA top threats","q":"What are the countermeasures for malicious insiders?","a":["Strict supply chain management; HR requirements in the legal contract; transparency and compliance reporting; a breach notification process."]},{"c":13,"t":"CSA top threats","q":"What are the countermeasures for shared technology issues?","a":["Security best practices for install/config; monitor for unauthorised changes; strong authentication for admins; SLAs for patching; vulnerability scans and configuration audits."]},{"c":13,"t":"CSA top threats","q":"What are the countermeasures for data loss or leakage?","a":["Strong API access control; encrypt and protect integrity of data in transit and at rest; analyse data protection at design and run time; strong key generation, storage, management and destruction."],"r":"CH13 S28"},{"c":13,"t":"CSA top threats","q":"What are the countermeasures for account or service hijacking?","a":["Prohibit sharing of account credentials between users and services; strong two-factor authentication where possible; proactive monitoring for unauthorised activity; understand CSP security policies and SLAs."],"r":"CH13 S29"},{"c":13,"t":"CSA top threats","q":"What are the countermeasures for an unknown risk profile?","a":["Disclosure of applicable logs and data; partial or full disclosure of infrastructure details; monitoring and alerting on necessary information."],"r":"CH13 S30"},{"c":13,"t":"Data protection and OpenStack","q":"What is the difference between multi-instance and multi-tenant cloud databases?","a":["Multi-instance: a uniquely running VM instance per subscriber; complete control over roles and authorisation.","Multi-tenant: a predefined environment SHARED with other tenants; data is TAGGED with a subscriber ID; the customer relies on the PROVIDER for a sound, secure database."]},{"c":13,"t":"Data protection and OpenStack","q":"What is OpenStack?","a":["An open-source cloud operating system that creates and manages large groups of virtual private servers. It is multi-tenant IaaS, simple and massively scalable."]},{"c":13,"t":"Internet of Things","q":"What is the Internet of Things?","a":["The expanding interconnection of SMART devices (appliances to tiny sensors), enabling people-things and thing-thing communication usually via the cloud. It is driven by deeply EMBEDDED devices."]},{"c":13,"t":"Internet of Things","q":"What are the main components of an IoT device (Fig 13.8)?","a":["Sensor, actuator, microcontroller, transceiver, RFID."]},{"c":13,"t":"Internet of Things","q":"What is the edge in IoT and what does a gateway do?","a":["The edge is made of IoT devices (sensors + actuators). A gateway translates protocols and may aggregate data."]},{"c":13,"t":"Internet of Things","q":"What is fog computing?","a":["Doing as much processing as possible near the sensors (evaluation, formatting, expanding/decoding, distillation/reduction, assessment) instead of in the central cloud."],"d":"Fog hovers low to the ground; clouds are high in the sky."},{"c":13,"t":"Internet of Things","q":"How does fog compare to cloud (Table 13.4)?","a":["Processing location: cloud = center, fog = edge. Latency: high vs low. Mobility support: not applicable vs yes. Control: centralised (full) vs distributed (partial). Users/devices: tens or hundreds of millions vs tens of billions. Main content generator: human vs devices/sensors."],"r":"CH13 S39"},{"c":13,"t":"Internet of Things","q":"Why is fog described as the opposite trend to cloud?","a":["Cloud centralises in a few big data centers; fog uses many small smart objects with local storage and processing."]},{"c":13,"t":"IoT security","q":"What are the six ITU-T Y.2066 IoT security requirements?","a":["Communication security, data management security, service provision security, integration of security policies and techniques, mutual authentication and authorisation, security audit."],"r":"CH13 S41"},{"c":13,"t":"IoT security","q":"What device types appear in the IoT security framework (Fig 13.10)?","a":["Constrained (C) and unconstrained (U) devices, gateways (G), and platforms (A)."]},{"c":13,"t":"IoT security","q":"Why is patching IoT devices a security concern?","a":["IoT devices are hard to patch, so known vulnerabilities can remain unfixed (the \"patching vulnerability\")."]},{"c":13,"t":"IoT security","q":"What is MiniSec and what are its goals?","a":["An open-source module in TinyOS providing LINK-level security with low energy use and very little memory. Goals: confidentiality, data authentication, replay protection, freshness (message age), and resilience to lost messages. It has 2 modes: single-source and multi-source broadcast."]}]}</script>
<script>
(function(){'use strict';
  var data=JSON.parse(document.getElementById('deck-data').textContent), all=[], deck=[], position=0, revealed=false;
  var titles={};
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  data.chapters.forEach(function(c){titles[c.n]=c.title;var o=document.createElement('option');o.value=String(c.n);o.textContent='Chapter '+c.n+' \u00b7 '+c.title;$('chapter').appendChild(o)});
  data.cards.forEach(function(c){all.push(c)});
  function updateFlip(){var card=$('card');card.classList.toggle('flipped',revealed);card.setAttribute('aria-pressed',String(revealed));card.setAttribute('aria-label',revealed?'Show question':'Reveal answer');card.querySelector('.front-face').setAttribute('aria-hidden',String(revealed));card.querySelector('.back-face').setAttribute('aria-hidden',String(!revealed))}
  function answerHtml(lines){if(lines.length===1)return '<p class="answer">'+esc(lines[0])+'</p>';return '<ul class="answer answer-list">'+lines.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>'}
  function render(){var x=deck[position],card=$('card');
    $('where').textContent='Chapter '+x.c+' | '+x.t;$('count').textContent=(position+1)+' / '+deck.length;
    var front='<span class="card-kicker">Question</span><span class="card-topic">Ch '+x.c+' \u00b7 '+esc(x.t)+'</span><h2 class="question">'+esc(x.q)+'</h2><span class="hint">Tap to reveal</span>';
    var back='<span class="card-kicker">Answer</span><p class="recall">'+esc(x.q)+'</p>'+answerHtml(x.a);
    if(x.d)back+='<p class="detail">'+esc(x.d)+'</p>';
    if(x.n)back+='<p class="meta note"><strong>Note</strong> - '+esc(x.n)+'</p>';
    if(x.r)back+='<p class="meta">Slide reference: '+esc(x.r)+'</p>';
    back+='<span class="hint">Tap to turn back</span>';
    card.classList.remove('flipped');card.innerHTML='<span class="card-inner"><span class="face front-face">'+front+'</span><span class="face back-face">'+back+'</span></span>';updateFlip();
    $('previous').disabled=position===0;$('next').disabled=position===deck.length-1;$('source').href='COS330%20Security%20Mindmap.html#ch'+x.c}
  function reset(){var chosen=$('chapter').value;deck=all.filter(function(x){return chosen==='all'||String(x.c)===chosen});position=0;revealed=false;render()}
  function flip(){revealed=!revealed;updateFlip()}
  function move(n){var next=Math.max(0,Math.min(deck.length-1,position+n));if(next===position)return;position=next;revealed=false;var card=$('card');card.classList.remove('swipe-next','swipe-previous');render();void card.offsetWidth;card.classList.add(n>0?'swipe-next':'swipe-previous')}
  $('chapter').addEventListener('change',reset);$('card').addEventListener('click',flip);$('previous').addEventListener('click',function(){move(-1)});$('next').addEventListener('click',function(){move(1)});
  $('shuffle').addEventListener('click',function(){for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=deck[i];deck[i]=deck[j];deck[j]=t}position=0;revealed=false;render()});
  document.addEventListener('keydown',function(e){if(/^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key===' '){e.preventDefault();flip()}});
  reset();
})();
</script></body></html>
