<script id="course-data" type="application/json">[{"n":1,"title":"Computer Security Overview","short":"Overview","hue":212,"mn":"CIA is the goal. Prevent, Detect, Recover is the method.","br":[{"t":"What is computer security?","mn":"C-I-A, plus Authenticity and Accountability","items":[{"t":"NIST: measures and controls that protect the C-I-A of information system assets","d":"Assets means hardware, software, firmware and the information being processed, stored or communicated. Every later chapter is a way of protecting one of the three letters."},{"t":"Confidentiality: only the right people can SEE it","d":"Covers data confidentiality and privacy. Breach example: a leaked password file."},{"t":"Integrity: only the right people can CHANGE it","d":"Includes data integrity and system integrity. Breach example: an attacker edits a bank balance. Authenticity and non-repudiation hang off integrity."},{"t":"Availability: timely, reliable access (whenever, on demand, usable)","d":"Breach example: a DoS attack takes the web server offline. Chapter 7 is entirely about this letter."},{"t":"Extra pillars: Authenticity and Accountability","d":"Authenticity: you can verify that someone or something is who they claim to be. Accountability: actions can be traced to one entity (needed for forensics and non-repudiation)."},{"t":"Impact if breached: Low (limited), Moderate (serious), High (severe or catastrophic)","d":"The level always depends on context. A leaked menu is Low; a leaked patient database is High.","g":"gen","n":"The Low/Moderate/High names are FIPS 199 as used again in Chapter 3. The one-line examples are mine."}]},{"t":"Security vs usability","mn":"Attacker needs ONE weakness; defender must close ALL","items":[{"t":"Always a trade-off: passwords and tokens add security but add friction"},{"t":"Attacker needs one weakness, defender must close all, so defence is always playing catch-up"},{"t":"Physical security is as important as logical security","d":"If someone can walk off with the server, the firewall does not matter."}]},{"t":"Core vocabulary","mn":"Vulnerability → Threat → Attack; countermeasures break the chain","items":[{"t":"Adversary (threat agent): individual, group, organisation or government conducting harmful activity"},{"t":"Vulnerability: a weakness that could be exploited","d":"A weakness, not an event."},{"t":"Threat: the potential for harm","d":"It has NOT happened yet. This is the favourite definition to mix up with attack."},{"t":"Attack: a threat carried out","d":"Attack = threat that actually happens."},{"t":"Countermeasure: reduces a vulnerability or impairs an attack"},{"t":"Risk = f(impact if it happens, likelihood it happens)","d":"High impact with low likelihood and low impact with high likelihood can both land at the same risk level. This is why risk assessment ranks things."}]},{"t":"Assets & vulnerabilities","mn":"H-S-D-C  |  Corrupted, Leaky, Unavailable","items":[{"t":"Assets: Hardware, Software, Data, Communication facilities and networks"},{"t":"Corrupted: loss of INTEGRITY","d":"The system works but gives wrong answers."},{"t":"Leaky: loss of CONFIDENTIALITY","d":"Someone who should not see the data can."},{"t":"Unavailable or very slow: loss of AVAILABILITY"}]},{"t":"Attacks","mn":"Passive = Peeking. Active = Acting","items":[{"t":"Passive: observe only, do not affect resources; hard to DETECT, easy to prevent","d":"Release of message contents and traffic analysis. Nothing changes, so nothing looks wrong."},{"t":"Active: alter resources or operation; easy to detect, hard to prevent","d":"Replay, masquerade, modification of messages, denial of service. The damage is visible, but you cannot stop every attempt."},{"t":"Insider: inside the perimeter. Outsider: outside it"},{"t":"Traffic analysis can leak information even when the content is encrypted","d":"The attacker sees who talks to whom and how often, not what is said.","g":"gen","n":"Explanation is general networking knowledge, not copied from the slides."}]},{"t":"Threat consequences (RFC 4949)","mn":"Disclosure, Deception, Disruption, Usurpation","items":[{"t":"Unauthorised disclosure: exposure, interception, inference, intrusion"},{"t":"Deception: masquerade, falsification, repudiation"},{"t":"Disruption: incapacitation, corruption, obstruction"},{"t":"Usurpation: misappropriation, misuse","d":"Taking over control of a resource or using it for something it was not meant for."}]},{"t":"Countermeasures","mn":"Prevent, Detect, Recover","items":[{"t":"Three actions: Prevent, Detect, Recover"},{"t":"Residual vulnerabilities may remain, so 100% security is never guaranteed","r":"CH1 S15","g":"add","n":"Added from the slide. The countermeasures slide also says a countermeasure may itself introduce new vulnerabilities, and the goal is to minimise the residual level of risk to the assets."},{"t":"A countermeasure can itself introduce a new vulnerability","d":"Example: a complex firewall rule set creates new misconfiguration risk.","g":"add","r":"CH1 S15","n":"The slide point is real; the firewall example is mine."}]},{"t":"Functional requirements (FIPS 200)","mn":"Know the category names and the core idea of each","items":[{"t":"Access control: limit system access to authorised users and processes"},{"t":"Identification & authentication; Audit & accountability (trace actions to a user)"},{"t":"Awareness & training; Personnel security"},{"t":"Certification, accreditation & security assessment: test that the controls work"},{"t":"Configuration management: baselines and secure settings"},{"t":"Contingency planning: backup and disaster recovery; Incident response"},{"t":"Maintenance; Media protection; Physical & environmental protection"},{"t":"Planning; Risk assessment; Systems & services acquisition"},{"t":"System & communications protection; System & information integrity"}]},{"t":"Attack surface & attack tree","mn":"Network, Software, Human","items":[{"t":"Attack surface: the reachable and exploitable vulnerabilities in a system"},{"t":"Network attack surface: open ports, protocols, services"},{"t":"Software attack surface: code that processes incoming data (web, email, documents)"},{"t":"Human attack surface: staff open to social engineering"},{"t":"Attack tree: branching diagram of ways to reach an attacker's goal","d":"Root = goal. Branches = sub-attacks (malware, brute-force PIN, man-in-the-middle, session hijack). Reducing the attack surface removes branches."}]},{"t":"Security strategy & standards bodies","mn":"Policy → Implementation → Assurance → Evaluation","items":[{"t":"Security policy: formal rules for protecting resources"},{"t":"Implementation: Prevention, Detection, Response, Recovery"},{"t":"Assurance: confidence that the measures work as intended"},{"t":"Evaluation: examining a product against criteria (Common Criteria)"},{"t":"NIST (US federal measurement science and standards); ISOC (Internet standards); ITU-T (UN telecom agency); ISO (international standards)"}]}]},{"n":2,"title":"Cryptographic Tools","short":"Crypto","hue":168,"mn":"Symmetric = 1 key. Asymmetric = key pair. Hash = no key. MAC = hash + secret. Signature = hash + private key.","br":[{"t":"Symmetric encryption","mn":"SAME key encrypts and decrypts","items":[{"t":"The universal technique for CONFIDENTIALITY","d":"Plaintext and key go into the algorithm and ciphertext comes out. The same key reverses it."},{"t":"Needs a strong algorithm and a secret key shared securely"},{"t":"Weakness is KEY DISTRIBUTION","d":"If the key is intercepted the attacker decrypts everything. Alice, Bob and Mike: if Mike intercepts K and the ciphertext, he reads it too."},{"t":"Block cipher: one BLOCK at a time, one output block per input block"},{"t":"Stream cipher: continuous, byte by byte; faster; needs a good pseudorandom keystream"},{"t":"ECB mode is weak: identical plaintext blocks give identical ciphertext, so patterns leak","d":"Avoid it. Block ciphers can be used in other modes that hide repeats."}]},{"t":"Symmetric algorithms","mn":"DES → 3DES → AES","items":[{"t":"DES: 64-bit block, 56-bit key; weak, brute-forceable"},{"t":"3DES: applies DES three times, 112 or 168-bit key; slow"},{"t":"AES: 128-bit block, 128 / 192 / 256-bit key; NIST 2001 (Rijndael); the current standard"},{"t":"Each extra key bit DOUBLES the brute-force work (2^n)","d":"That is exponential growth, so a modest increase in key length is an enormous increase in cracking time."},{"t":"56-bit key: about 1.125 years at 10^9 decryptions/s, about 1 hour at 10^13 decryptions/s","g":"fix","r":"Table 2.2","n":"The friend's note said '56-bit: hours'. The slide's Table 2.2 gives 1.125 years at 10^9 decryptions per second and 1 hour at 10^13 per second. 'Hours' is only true for the fast attacker."},{"t":"128-bit key: roughly 5 × 10^21 years at 10^9 decryptions/s, far longer than the age of the universe","g":"gen","n":"My own arithmetic: 2^127 / 10^9 per second / seconds per year. Check Table 2.2 for the slide's exact figure."}]},{"t":"Hash functions","mn":"INTEGRITY, not secrecy: a fingerprint","items":[{"t":"Any-size input → FIXED-length digest"},{"t":"Six properties: variable input size, fixed output, easy to compute, pre-image resistant (one-way), second pre-image resistant, collision resistant","g":"fix","n":"The friend's list was missing second pre-image resistance. The slides give six properties.","d":"Pre-image: given h, you cannot find any x with H(x)=h. Second pre-image: given x, you cannot find a different y with H(y)=H(x). Collision: you cannot find any pair x,y that hash the same."},{"t":"A 1-bit change in the input gives a completely different hash","d":"This is why hashes detect tampering.","g":"gen","n":"Standard hash behaviour (avalanche effect); not stated in these words on the slides."},{"t":"Algorithms: MD5, SHA-1, SHA-2 / SHA-256","d":"MD5 and SHA-1 are considered broken today.","g":"gen","n":"'Weak' for MD5/SHA-1 is general knowledge, not from the slides."},{"t":"Uses: password storage (store H(password)), file integrity checks, digital forensics"}]},{"t":"MAC vs hash","mn":"MAC = hash + SHARED SECRET KEY","items":[{"t":"MAC: a short tag from a message plus a shared secret key; gives integrity AND authenticity"},{"t":"Hash: no key; anyone can compute it, so it cannot authenticate by itself","d":"An attacker can alter the message and recompute the hash. With a MAC they cannot, because they lack the key."},{"t":"MAC does not give non-repudiation","d":"Both sides share the key, so either could have made the tag. Signatures fix that (see Digital signatures).","g":"gen","n":"Reasoning from the shared-key property; the slide summary only says Signature = + non-repudiation."}]},{"t":"Public-key (asymmetric)","mn":"What one key locks, only its PAIR unlocks","items":[{"t":"Two mathematically linked keys"},{"t":"Public key: shared with anyone; used to ENCRYPT or VERIFY"},{"t":"Private key: kept secret; used to DECRYPT or SIGN"},{"t":"Solves key distribution because the private key never travels","d":"The price is speed. Asymmetric operations are much slower than symmetric ones, which is why the digital envelope exists."}]},{"t":"Algorithm applications","mn":"RSA and Elliptic Curve do all three. DSS signs only. Diffie-Hellman only distributes keys.","items":[{"t":"Table 2.3: which algorithm does which job","b":"t23","r":"CH2 S33","g":"fix","n":"The friend had the Diffie-Hellman row wrong (signature yes, key distribution NO). On slide 33 Diffie-Hellman is signature NO, symmetric key distribution YES, encryption of secret keys NO."}]},{"t":"Digital signatures","mn":"Signature = hash + private key","items":[{"t":"NIST FIPS 186-4: gives origin authentication, data integrity and signatory non-repudiation"},{"t":"Sign: hash the document, then encrypt the hash with your PRIVATE key"},{"t":"Verify: decrypt with the sender's PUBLIC key, compare the hashes","d":"If the two hashes match, the document is unchanged and the signer held the private key."},{"t":"Non-repudiation: only the sender has the private key, so they cannot deny signing"}]},{"t":"Digital envelope","mn":"Hybrid: symmetric speed + asymmetric key delivery","items":[{"t":"Encrypt the message with a fast symmetric key, then encrypt THAT key with the receiver's public key"},{"t":"You get the speed of symmetric and the key-distribution benefit of asymmetric","d":"The receiver unwraps the symmetric key with their private key, then decrypts the long message with it."}]},{"t":"Random numbers & stored data","mn":"True random vs pseudorandom","items":[{"t":"Random numbers are used for keys, session keys, stream keystreams and handshakes (anti-replay)"},{"t":"True random: unpredictable and independent. Pseudorandom: algorithmic but passes statistical tests"},{"t":"Encrypting STORED data is rarer than in transit because it interferes with access and search"},{"t":"'Deleted' files are often recoverable until the sectors are overwritten"}]},{"t":"Worked example: double transposition","mn":"Number the key letters, fill rows, read columns, repeat with the other key","items":[{"t":"Double columnar transposition (semester test Q4 style)","tool":"transp","g":"add","r":"COS330 - ST1 Q4","n":"Procedure and answer are from the semester test's marked solution and re-checked by running the code: the ciphertext decrypts to the marked plaintext and re-encrypts back to the exact ciphertext. Treat which keyword counts as 'first' as set by the question wording.","d":"Steps: (1) take each key phrase, drop repeated letters, keep the first occurrence. (2) Number the letters alphabetically, 1 for the earliest. (3) To encrypt, write the text in rows under the key and read the columns in number order. (4) Pad short text with X. (5) Repeat with the second key. To decrypt, undo the LAST key first."}]},{"t":"Summary lines","mn":"Reversible vs one-way","items":[{"t":"Symmetric = 1 key (fast, distribution problem). DES → 3DES → AES"},{"t":"Asymmetric = key pair (RSA, DH, DSS, ECC)"},{"t":"Encryption is reversible (confidentiality). Hashing is one-way (integrity)"},{"t":"MAC = integrity + authentication. Signature = integrity + authentication + non-repudiation"}]}]},{"n":3,"title":"User Authentication","short":"Authentication","hue":28,"mn":"Identification = claim. Authentication = proof. Know / Have / Are / Do.","br":[{"t":"Identification vs authentication","mn":"Username claims. Password proves.","items":[{"t":"Identification: claiming who you are (username)"},{"t":"Authentication: PROVING it (password, token, biometric)"},{"t":"NIST SP 800-63-3: establishing confidence in electronically presented identities"},{"t":"SP 800-171 checklist: multi-factor for privileged accounts; replay-resistant mechanisms; no reuse of identifiers and disable inactive ones; minimum password complexity with periodic change; store and transmit only cryptographically protected passwords; OBSCURE feedback"},{"t":"Obscure feedback: never reveal which field was wrong","d":"'Invalid username or password' tells the attacker nothing. 'Wrong password' confirms the username exists."}]},{"t":"Four means of authentication","mn":"KNOW, HAVE, ARE, DO","items":[{"t":"KNOW: password, PIN, security questions"},{"t":"HAVE (token): smartcard, keycard, physical key"},{"t":"ARE (static biometric): fingerprint, retina, face"},{"t":"DO (dynamic biometric): voice, handwriting, typing rhythm"},{"t":"Multifactor = 2 or more factors","d":"A bank card (have) plus PIN (know). Two passwords is NOT multifactor, because both are 'know'."}]},{"t":"Risk assessment","mn":"Assurance level, areas of risk, potential impact","items":[{"t":"Assurance level: confidence that the person is who they claim (SP 800-63-3: 4 levels, little to very high)"},{"t":"Areas of risk: where in the system authentication risk applies"},{"t":"Potential impact (FIPS 199): Low / Moderate / High if authentication fails","d":"Impact categories include inconvenience or reputation, financial loss, harm to programs, unauthorised release of sensitive information, personal safety, civil or criminal violations.","g":"add","r":"CH3 Table 3.2","n":"Categories read from the Table 3.2 slide."}]},{"t":"Password attacks","mn":"Combinations = (alphabet size) ^ (length)","items":[{"t":"Offline dictionary attack: steal the password file, try words offline"},{"t":"Guessing against one user: birthday, pet names"},{"t":"Brute force: every combination","d":"Worked example: 52 letters (a-z, A-Z) over 8 characters = 52^8 = 53,459,728,531,456, about 5.3 × 10^13 combinations. Adding digits (62 characters) makes it 62^8, about 2.2 × 10^14.","g":"gen","n":"Arithmetic checked in code. The 52^8 case is the friend's example; the 62-character case is mine."},{"t":"Bigger alphabet and longer length hugely raise cracking time","d":"Length is the stronger lever because it is the exponent."}]},{"t":"Salting","mn":"Salt + password, THEN hash","items":[{"t":"UNIX: a random salt is combined with the password BEFORE hashing; the entry stores salt + hash"},{"t":"Identical passwords hash DIFFERENTLY","d":"Two users with 'letmein' get different stored values, so cracking one does not crack the other."},{"t":"Defeats rainbow tables: the attacker would need one table per possible salt"},{"t":"Does NOT stop brute force against a single account"},{"t":"Rainbow table = precomputed hash → password lookup"}]},{"t":"Protecting passwords","mn":"Hide the file, check passwords up front","items":[{"t":"Password file access control: readable by privileged users only (shadow password file)"},{"t":"Proactive checking: rule enforcement (composition rules)"},{"t":"Proactive checking: dictionary checker (large do-not-use list)"},{"t":"Proactive checking: Bloom filter, a space-efficient hash table of bad passwords","d":"It can say 'definitely not on the list' or 'probably on the list', so a good password is never rejected for being on a list it is not on, and checking is fast and small.","g":"gen","n":"Bloom filter behaviour is general computer science; the slides only name it as a space-efficient bad-password check."}]},{"t":"Token-based","mn":"Memory card stores. Smart card computes.","items":[{"t":"Memory card: stores but does NOT process (magnetic stripe, hotel key)"},{"t":"Smart card or token: has an embedded MICROPROCESSOR (processor, memory, I/O)"},{"t":"Smart card protocols: static, dynamic password generator, challenge-response"},{"t":"Smart card memory: ROM (permanent), EEPROM (programs and app data), RAM (working data)"},{"t":"eID card: a smart card used as a national ID with government-verified identity"}]},{"t":"Biometrics","mn":"Enrol once, verify every time","items":[{"t":"Authenticates UNIQUE physical characteristics by pattern recognition; more complex and expensive"},{"t":"Face, fingerprint, hand geometry, retina, iris, signature, voice"},{"t":"Enrollment: capture and store a template"},{"t":"Verification: capture again and compare to the template"},{"t":"Needs a PHYSICAL scanner present"}]},{"t":"Remote authentication","mn":"Challenge-response beats replay","items":[{"t":"Information travels across a network, so there is extra risk"},{"t":"Threats: eavesdropping, password capture, REPLAY of a seen sequence"},{"t":"Defence: challenge-response. The server sends a changing challenge so an old response cannot be reused","d":"Because the challenge is different each time, a recorded reply is useless."}]},{"t":"Summary & exam note","mn":"Pracs 1-3 concepts are examinable","items":[{"t":"Identification = claim. Authentication = proof. KNOW / HAVE / ARE / DO"},{"t":"Passwords: salted + hashed + protected file + proactive checks"},{"t":"Practical concepts (Pracs 1-3) are examinable","d":"Taken from the friend's lecture notes on the semester test scope."}]}]},{"n":4,"title":"Access Control","short":"Access control","hue":262,"mn":"DAC = owner's discretion. MAC = central labels. RBAC = job role. ABAC = attributes and context.","br":[{"t":"What is access control?","mn":"Authenticate FIRST, then access control decides WHAT you may do","items":[{"t":"NISTIR 7298: granting or denying requests to (1) obtain and use information and services, (2) enter physical facilities"},{"t":"RFC 4949: use of resources regulated by a security policy, permitted only to authorised entities"},{"t":"Authenticate first, then access control decides what you may do"},{"t":"Policy is defined, but ultimately set by a human"},{"t":"Auditing feeds digital forensics"}]},{"t":"The four models","mn":"DAC, MAC, RBAC, ABAC","items":[{"t":"DAC: identity plus access rules; the OWNER decides who gets access","d":"Typical example: UNIX file permissions. Flexible, but a careless owner can give away too much."},{"t":"MAC: security LABELS compared against CLEARANCES; a central authority decides (military)","d":"Users cannot change the labels on their own files. Nested levels, with higher clearance able to read lower labels.","g":"fix","n":"The friend named the levels 'Top Secret > Secret > Private > Public'. Those exact names are not on the slides. Treat them as an illustration of the idea of ordered levels, not as examinable wording."},{"t":"RBAC: access based on the ROLE in the organisation"},{"t":"ABAC: attributes of the user, the resource and the environment","d":"Example: allow access only during business hours, from a company device, for someone in the right department."}]},{"t":"Subjects, objects, rights","mn":"ACL per OBJECT. Capability list per SUBJECT.","items":[{"t":"Subject: an entity able to access objects (a user, a process)"},{"t":"Object: a resource whose access is controlled (a file)"},{"t":"Access right: HOW a subject may access an object (read, write, execute, own)"},{"t":"Access matrix: subjects as rows, objects as columns","d":"Reading a COLUMN gives the ACL for that object (who can access THIS file). Reading a ROW gives that subject's capability list (what can THIS user access)."},{"t":"ACL is stored per OBJECT. Capability list is stored per SUBJECT"},{"t":"Extended matrix adds processes and disk drives as subjects/objects; rights can include a copy flag"}]},{"t":"UNIX file access control","mn":"inode, owner/group/other, r/w/x","items":[{"t":"Files are managed via inodes (attributes, permissions, control info)"},{"t":"One inode = one file; many names can point to one inode","d":"That is how hard links work."},{"t":"Directories are a tree of filenames plus inode pointers"},{"t":"Traditional: user ID + group ID + 12 protection bits (r/w/x for owner, group, other)"},{"t":"Modern UNIX: ACLs (setfacl) for fine-grained rules"}]},{"t":"RBAC","mn":"Rights attach to the job, not the person","items":[{"t":"Rights are granted to ROLES; users are assigned to roles"},{"t":"A job change means changing only the role assignment"},{"t":"Users ↔ Roles ↔ Permissions is many-to-many","d":"Fig 4.7 shows this as two matrices: users against roles, then roles against objects (and roles can also be given rights over other roles, such as owner or control).","r":"CH4 S24","g":"add","n":"Fig 4.7 viewed in the slide image."}]},{"t":"ABAC","mn":"Flexible and expressive; slower to evaluate","items":[{"t":"Strength: flexible and expressive. Obstacle: performance overhead of evaluating attribute predicates"},{"t":"Subject attributes: identifier, name, organisation, job title, role"},{"t":"Object attributes: ownership, service taxonomy, QoS"},{"t":"Environment attributes: date/time, threat level, network type"},{"t":"XACML: the standard for expressing ABAC policies (web services)"}]},{"t":"ICAM","mn":"Sponsor → Enroll → Produce → Issue → Maintain","items":[{"t":"US-government approach: create digital identities, give them credentials, use them to grant authorised access"},{"t":"Identity management: attributes bound to a digital identity linked to a real person or an NPE (non-person entity); trustworthy and independent of any one application"},{"t":"Credential management, step 1 Sponsorship: an authorised person sponsors the credential"},{"t":"Step 2 Enrollment: identity proofing, capture of biographic/biometric data"},{"t":"Step 3 Credential production: encryption, digital signature, smart card creation"},{"t":"Step 4 Issuance: the credential is given to the individual or NPE"},{"t":"Step 5 Maintenance: revocation, reissuance, expiry, PIN reset, suspension"},{"t":"Credentials include smart cards, key pairs and digital certificates"},{"t":"Access management has 3 elements: resource management, privilege management, policy management","d":"Resource management = rules for accessing a resource. Privilege management = maintains entitlement/privilege attributes. Policy management = what is allowable or unallowable in a transaction."}]},{"t":"Identity federation","mn":"One organisation trusts identities issued by another","items":[{"t":"Solves how to trust identities from EXTERNAL organisations on YOUR systems"},{"t":"Solves how to vouch for YOUR people at external organisations"},{"t":"Frameworks named in the slides: OpenID, OITF, OIDF, ICF, OIX, AXN"}]},{"t":"Summary lines","mn":"Models at a glance","items":[{"t":"DAC = owner's discretion | MAC = central labels | RBAC = job role | ABAC = attributes + context"},{"t":"ACL per object; capability list per subject"}]}]},{"n":5,"title":"Database & Data Center Security","short":"Databases","hue":342,"mn":"SQLi: terminate the string, append a command, comment out the rest. Data centers: Data, Network, Physical, Site.","br":[{"t":"Database background","mn":"Relation = table, tuple = row, attribute = column","items":[{"t":"Database: a structured data collection that stores RELATIONSHIPS too"},{"t":"DBMS: programs to build and maintain the database; ad hoc queries for many users"},{"t":"DBMS parts: DDL processor, DML/query processor, authorisation table, file manager"},{"t":"Relational database: tables of rows and columns linked by a shared key, queried with SQL"},{"t":"Primary key uniquely identifies a row; foreign key links tables"},{"t":"View: a query result used for SECURITY, because it limits what a user sees"}]},{"t":"SQL injection (SQLi)","mn":"Terminate the string, append a command, end with --","items":[{"t":"Malicious SQL hidden in normal-looking input; the usual goal is BULK DATA extraction"},{"t":"Technique: prematurely TERMINATE a string, append a command, end with a -- comment","d":"The comment marker throws away whatever the programmer wrote after your input, such as the closing quote or a password check."},{"t":"Avenues: user input, server variables (forged headers), second-order injection (stored, triggered later), cookies, physical user input"}]},{"t":"Three types of SQLi","mn":"In-band, Inferential, Out-of-band","items":[{"t":"In-band: the same channel is used to inject AND get results","d":"Tautology, end-of-line comment, piggybacked queries."},{"t":"Inferential: no data is transferred; the attacker reconstructs information from server behaviour","d":"Illegal or incorrect queries, and blind SQLi."},{"t":"Out-of-band: data is retrieved through a DIFFERENT channel (for example, emailed out)"}]},{"t":"SQLi countermeasures","mn":"Defensive coding, detection, run-time prevention","items":[{"t":"Defensive coding: manual secure coding, signature/anomaly detection, code analysis, data-type validation and escaping"},{"t":"Detection: check queries at run time against EXPECTED structures"},{"t":"Run-time prevention: block or alter suspicious queries","d":"Prepared statements are the standard coding fix and are covered again in Chapter 11.","g":"gen","n":"Linking to Chapter 11's prepared statements is my cross-reference."}]},{"t":"Database access control","mn":"GRANT and REVOKE","items":[{"t":"Ownership-based: the creator of a table grants and revokes rights"},{"t":"Decentralised: the owner lets others grant and revoke on their behalf"},{"t":"GRANT (can allow re-grant) and REVOKE"},{"t":"Rights: SELECT, INSERT, UPDATE, DELETE, REFERENCES"},{"t":"Cascading revocation: a grant stays valid only if the granter still holds the right through a valid, earlier grant (or is the owner)","d":"Method: for each remaining grant G→H at time t, check that G is the owner or still holds the right through a valid grant with an EARLIER timestamp. Remove grants that fail. Repeat until nothing changes.","g":"gen","n":"This rule is my own assumption, not stated on the slides. It matched all 5 revocation scenarios in the semester test when checked, but confirm against your lecturer's wording."}]},{"t":"Roles in databases","mn":"Owner, end user, administrator","items":[{"t":"Application owner: owns the DB objects of an application"},{"t":"End user: operates through an application and owns nothing"},{"t":"Administrator: responsible for part or all of the database"},{"t":"MS SQL Server fixed roles: sysadmin, securityadmin, db_owner, db_datareader / db_datawriter, db_denydatareader / db_denydatawriter"}]},{"t":"Inference","mn":"Allowed queries combined reveal forbidden data","items":[{"t":"Inference: figuring out forbidden data by combining the results of several ALLOWED queries"},{"t":"Detection during DB design: change the structure or access control up front; often too strict and lowers availability"},{"t":"Detection at query time: detect the violation as queries run and deny or alter them; more flexible, harder to build"}]},{"t":"Database encryption","mn":"The last line of defence","items":[{"t":"A database is the richest, most concentrated target; encryption is an important LAST line of defence"},{"t":"Challenge: key management overhead (many keys)"},{"t":"Challenge: inflexibility, since searching and indexing get harder"},{"t":"Searching encrypted data means decrypting first (costly); an index over encrypted data helps"}]},{"t":"Data center security","mn":"Data, Network, Physical, Site","items":[{"t":"Data center: an enterprise facility (room to building) housing IT infrastructure (cloud, search engines, research)"},{"t":"Layered model, Fig 5.12: Data, Network, Physical, Site","f":"layers","g":"fix","r":"CH5 Fig 5.12","n":"The friend's second layer was 'Application'. The slide figure says Network."},{"t":"Data layer: encryption, password policy, masking, retention (ISO 27002)"},{"t":"Network layer: firewalls, anti-virus, IDS/IPS, authentication"},{"t":"Physical layer: surveillance, mantraps, 2/3-factor authentication, zones (ISO 27001/27002)"},{"t":"Site layer: setbacks, redundant utilities, buffer zones, crash barriers, controlled entry"},{"t":"TIA-942: minimum telecom infrastructure requirements (hosting, distribution, environmental control, cabling)"}]},{"t":"Data center tiers","mn":"Higher tier = more redundancy = less downtime","items":[{"t":"Table 5.4: tier, redundancy and yearly downtime","b":"t54","r":"CH5 Table 5.4","g":"add","n":"Percentages and downtime hours read from the slide image of Table 5.4."},{"t":"Tier 1: single path, no redundancy, shut down for maintenance"},{"t":"Tier 2: single path plus some redundant components"},{"t":"Tier 3: multiple paths, ONE active; maintenance without disruption"},{"t":"Tier 4: multiple ACTIVE paths; survives a worst-case event"}]}]},{"n":6,"title":"Malicious Software","short":"Malware","hue":4,"mn":"Describe any malware with two questions: how does it SPREAD (propagation) and what does it DO (payload)?","br":[{"t":"What is malware?","mn":"Propagation + Payload","items":[{"t":"NIST: a program inserted covertly to compromise the C-I-A of victim data, apps or OS, or just to annoy"},{"t":"Propagation: HOW it spreads (infect content, exploit vulnerabilities, social engineering)"},{"t":"Payload: WHAT it does (corrupt, make a bot, steal info, stay hidden)"}]},{"t":"Classification & terms","mn":"Parasitic vs independent; replicates or not","items":[{"t":"Needs a HOST program (parasitic): virus. Independent: worm, trojan, bot"},{"t":"Replicates: virus, worm. Does NOT replicate: trojan, spam"},{"t":"Attack kit (Zeus, Angler, Metasploit): lets novices build malware"},{"t":"Downloader installs bigger malware. Exploit = code for one vulnerability"},{"t":"Logic bomb waits for a condition. Keylogger. Spyware"},{"t":"Zombie/bot attacks others on command. Flooder = DoS client"}]},{"t":"APT (Advanced Persistent Threat)","mn":"Advanced, Persistent, Threat","items":[{"t":"Well-resourced, often state-sponsored; targets ONE organisation for a long time"},{"t":"Examples: Aurora, RSA, APT1, Stuxnet"},{"t":"Techniques: spear-phishing, drive-by downloads, watering hole"},{"t":"Aim: steal intellectual property or infrastructure data"},{"t":"Advanced = many tools. Persistent = never gives up. Threat = humans behind it","d":"A patient burglar casing ONE house."}]},{"t":"Viruses","mn":"Dormant, Propagation, Triggering, Execution: 'Dogs Prefer Treats Eagerly'","items":[{"t":"Infects a program by modifying it to include a copy of itself; runs when the host runs"},{"t":"3 components: infection mechanism, trigger (logic bomb), payload"},{"t":"4 phases: Dormant (idle), Propagation (copies itself), Triggering (event activates), Execution (payload runs)"},{"t":"By TARGET: boot sector, file infector, macro, multipartite","d":"Macro viruses infect DOCUMENTS and are platform independent (Melissa, 1998)."},{"t":"By CONCEALMENT: encrypted, stealth, polymorphic, metamorphic"},{"t":"Polymorphic mutates its APPEARANCE each infection. Metamorphic rewrites itself completely (code AND behaviour)","d":"Same person in new clothes vs a new person each time."}]},{"t":"Worms","mn":"A worm WALKS across networks. A virus HITCHHIKES in a file.","items":[{"t":"Runs independently and copies a COMPLETE version of itself across networks"},{"t":"Replication: email/IM, remote execution, remote login"},{"t":"Target discovery: random (lots of traffic)","d":"Random IPs. Noisy."},{"t":"Target discovery: hit-list (fast, stealthy), topological (uses victim info such as address books), local subnet (behind a firewall, scans its own LAN)"},{"t":"Spread is an S-curve: slow start, fast spread, slow finish"},{"t":"Timeline: Morris 1988, Melissa 1998, Code Red 2001, Nimda 2001, Slammer 2003, Mydoom 2004, Conficker 2008, Stuxnet 2010, WannaCry 2017","d":"Morris: UNIX, password cracking, finger bug, debug trapdoor in mail. Code Red: IIS buffer overflow. Slammer: SQL Server overflow, very fast. WannaCry: ransomware worm using an SMB flaw, with a kill switch. Mobile worms: Cabir 2004, Lasco, CommWarrior (Bluetooth/MMS)."}]},{"t":"Client-side attacks","mn":"Drive-by = any visitor. Watering hole = the target. Malvertising = the ad.","items":[{"t":"Mobile code: Java applets, ActiveX, JavaScript, VBScript; shipped unchanged to many platforms"},{"t":"Drive-by download: just visiting a page installs malware (browser or plugin flaw)"},{"t":"Watering hole: compromise the site YOUR TARGET visits, then wait"},{"t":"Malvertising: paid ads carrying malware on legitimate sites; the site itself is NOT compromised"},{"t":"Clickjacking: hidden frames, so you click what you cannot see"},{"t":"Social engineering: tricking users (spam, trojans)"}]},{"t":"Payload: corruption","mn":"Ransomware, BIOS damage, logic bombs","items":[{"t":"Ransomware encrypts files and demands payment (WannaCry); backups are the recovery"},{"t":"Chernobyl virus rewrites the BIOS, which means physical damage"},{"t":"Stuxnet: industrial sabotage"},{"t":"Logic bomb explodes when a condition is met"}]},{"t":"Payload: bots & zombies","mn":"Remote control is what separates a bot from a worm","items":[{"t":"A bot takes over an Internet computer to launch attacks; a botnet is a coordinated collection of bots"},{"t":"Uses: DDoS, spam, sniffing, keylogging, spreading malware, adware, manipulating polls and games"},{"t":"Remote control: IRC channel commands (classic), HTTP covert channels, P2P (no single point of failure)"}]},{"t":"Payload: information theft","mn":"Phishing = net. Spear-phishing = spear.","items":[{"t":"Keylogger: captures keystrokes and filters for 'login' or 'password'"},{"t":"Spyware: monitors browsing and redirects to fake sites"},{"t":"Phishing: spam email pointing to a fake bank or login site"},{"t":"Spear-phishing: researched, personalised email to one person"}]},{"t":"Payload: stealthing","mn":"Backdoor = hidden door in. Rootkit = hidden room and cloak once inside.","items":[{"t":"Backdoor (trapdoor): a secret entry that bypasses security"},{"t":"Maintenance hook: a backdoor used by programmers to debug"},{"t":"Rootkit: HIDDEN tools installed after root access; hides processes, files, registry"},{"t":"Rootkit classes: persistent (survives reboot), memory-based (RAM only), user mode (intercepts APIs), kernel mode (alters the system call table, e.g. knark), virtual-machine based (thin hypervisor), external mode (BIOS / SMM)"}]},{"t":"Countermeasures","mn":"Anti-virus generations: S-H-A-F","items":[{"t":"PREVENTION first: policy, awareness, vulnerability mitigation, threat mitigation"},{"t":"If prevention fails: detect → identify → remove"},{"t":"1st generation Signature scanners (known malware only)"},{"t":"2nd generation Heuristic (rules, checksums)"},{"t":"3rd generation Activity traps (watch ACTIONS)"},{"t":"4th generation Full-featured (all combined plus access control)"},{"t":"Sandbox analysis: run in an emulator and watch behaviour; good against polymorphic and metamorphic malware"},{"t":"Behaviour blocking: real-time monitoring. Con: the malware must RUN first, and false positives happen"},{"t":"Perimeter scanning: ingress monitors (enterprise ↔ Internet border) and egress monitors (LAN borders; honeypot-style traffic to unused IPs)"},{"t":"Practical 5: problem 6.2 (can program D decide whether a program is a virus?) and 6.3 (metamorphic code sequence, dummy instructions)"}]}]},{"n":7,"title":"Denial-of-Service Attacks","short":"DoS","hue":32,"mn":"DoS attacks AVAILABILITY by exhausting a resource: bandwidth, system tables, or the application.","br":[{"t":"What is DoS?","mn":"Exhaust bandwidth, system or application resources","items":[{"t":"An action that PREVENTS or IMPAIRS authorised use of networks, systems or apps by exhausting resources (CPU, memory, bandwidth, disk)"},{"t":"An attack on AVAILABILITY, the A in CIA"},{"t":"Network bandwidth: ping flood, UDP flood"},{"t":"System resources: SYN spoofing (OS network code, tables)"},{"t":"Application resources: HTTP flood, Slowloris","d":"Road jammed, till overloaded, cashiers stuck on one fake customer."}]},{"t":"Classic DoS","mn":"Flooding ping, source spoofing, SYN spoofing","items":[{"t":"Flooding ping: overwhelm the link capacity; the attacker is identifiable unless spoofed"},{"t":"Source address spoofing: a forged source (raw sockets); hard to trace"},{"t":"Backscatter: replies landing at innocent addresses","d":"Spoofed packets make the victim reply to random third parties. Defenders can watch backscatter to spot attacks.","g":"gen","n":"The defender-side observation is general knowledge; the slides define backscatter only as the stray replies."},{"t":"SYN spoofing: attacks the connection table (the most common)"}]},{"t":"TCP handshake & SYN spoofing","mn":"1000 fake reservations: tables held for nobody","items":[{"t":"3-way handshake: SYN, SYN-ACK, ACK, connected","f":"syn"},{"t":"Attack: flood SYNs with FORGED source addresses"},{"t":"The server sends SYN-ACKs to the fake addresses and holds half-open entries waiting for an ACK that never comes"},{"t":"The table fills up, so real users are refused"}]},{"t":"Flooding attacks","mn":"Volume wins; any packet type works","items":[{"t":"Aim: overload network capacity with VOLUME"},{"t":"ICMP flood: echo requests (ping is allowed in as a diagnostic tool)"},{"t":"UDP flood: packets to a port on the target"},{"t":"TCP SYN flood: TCP packets to the target"}]},{"t":"DDoS (distributed)","mn":"Attacker → Handlers → Zombies → Target","items":[{"t":"Many systems (a botnet of zombies) attack at once"},{"t":"Chain: Attacker → Handlers → Zombies (agents) → Target"},{"t":"Needs less attacker bandwidth and is harder to trace"},{"t":"SIP flood: a flood of INVITE requests overwhelms the SIP proxy (VoIP signalling)"}]},{"t":"HTTP-based attacks","mn":"Flood = shouting. Slowloris = mumbling and never finishing.","items":[{"t":"HTTP flood: lots of HTTP requests at a web server","d":"Spidering: bots follow ALL links recursively."},{"t":"Slowloris: partial requests that NEVER complete","d":"It hogs every request-handling thread until capacity is used up. It looks legitimate, so signature-based IDS/IPS misses it."}]},{"t":"Reflection & amplification","mn":"Reflection = bounce. Amplification = bounce with a bigger reply.","items":[{"t":"Reflection: the spoofed source is the TARGET, so an intermediary (the reflector) replies to the target"},{"t":"DNS amplification: a small query produces a MUCH larger response sent to the target"},{"t":"Defence: block spoofed source addresses"}]},{"t":"Four lines of defence","mn":"Before, during, tracing, after","items":[{"t":"1. Prevention & pre-emption (before): policies, firewalls, block spoofing"},{"t":"2. Detection & filtering (during)"},{"t":"3. Traceback & identification (the ISP traces the source)"},{"t":"4. Reaction (after): eliminate the cause, update the response plan"},{"t":"DoS cannot be fully prevented, because high traffic may be legitimate (a flash crowd)"}]},{"t":"Prevention methods","mn":"Filter, cookie, CAPTCHA, replicate","items":[{"t":"Block spoofed addresses: routers as close to the source as possible; check the path back to the source"},{"t":"SYN cookies (modified TCP handling): a cryptographic cookie as the initial sequence number; drop old half-open entries when the table overflows","d":"The server stores nothing for a half-open connection, so there is no table to fill."},{"t":"Block IP-directed broadcasts and suspicious services"},{"t":"CAPTCHA separates humans from bots (application attacks)"},{"t":"Mirrored or replicated servers for high availability"},{"t":"Routes cannot be encrypted, so rely on filtering"}]},{"t":"Responding to an attack","mn":"Plan, identify, filter, trace, recover, learn","items":[{"t":"Before: a good incident response plan (ISP contacts, monitors, IDS)"},{"t":"Identify the TYPE of attack before countering it"},{"t":"Capture and analyse packets, design filters, or fix the app/system bug"},{"t":"The ISP traces the packet flow back (slow, needed for legal action)"},{"t":"Contingency: backup servers, or a new site or new addresses"},{"t":"Afterwards: analyse and update the response plan"}]}]},{"n":8,"title":"Intrusion Detection","short":"IDS","hue":98,"mn":"Sensors collect, analysers decide, the user interface shows. HIDS, NIDS, distributed. Signature vs anomaly.","br":[{"t":"Intruders","mn":"Classes and skill levels","items":[{"t":"Cyber criminals: financial reward, identity theft, data theft"},{"t":"Activists: social or political cause (hacktivists), often low skill"},{"t":"State-sponsored: espionage or sabotage, highly skilled"},{"t":"Others: hobbyists, curiosity"},{"t":"Apprentice USES existing toolkits (most numerous, EASIEST to stop)"},{"t":"Journeyman MODIFIES and extends tools"},{"t":"Master FINDS new vulnerabilities and MAKES tools (HARDEST to stop)"}]},{"t":"Intruder behaviour","mn":"I-A-P-G-M-C: 'I Always Plan Great Mischief, Carefully'","items":[{"t":"1. Information gathering: DNS, WHOIS, NMAP, probe services"},{"t":"2. Initial access: brute-force password, plugin exploit, spear-phish"},{"t":"3. Privilege escalation: local exploits, sniffers for admin passwords"},{"t":"4. Gather / exploit: find data, transfer documents out"},{"t":"5. Maintain access: rootkit, remote admin tool, disable AV/IDS"},{"t":"6. Cover tracks: hide files, edit logs"}]},{"t":"IDS basics","mn":"Sensors, Analyzers, User interface","items":[{"t":"Intrusion detection = gathering and analysing information to identify possible intrusions"},{"t":"Sensors COLLECT data. Analyzers DECIDE whether an intrusion occurred. The user interface shows output and controls the IDS"},{"t":"HIDS: monitors one host. NIDS: monitors network traffic and protocols. Distributed/hybrid: many sensors, central analysis"}]},{"t":"IDS requirements","mn":"Always on, hard to fool, light","items":[{"t":"Run continually, fault tolerant, resist subversion"},{"t":"Minimal overhead, configurable to policy"},{"t":"Adapt to changes, scale well"},{"t":"Graceful degradation, dynamic reconfiguration"},{"t":"An IDS can cause DoS: cutting off the intruder may cut off ALL users"}]},{"t":"Analysis approaches","mn":"Signature = wanted poster. Anomaly = bouncer who knows the regulars.","items":[{"t":"Signature / heuristic (rule-based): matches known-bad patterns; FAST; cannot detect without a signature"},{"t":"Anomaly: learn NORMAL, flag deviations; slower with a learning curve, but catches NEW attacks"},{"t":"The big problem with anomaly detection is FALSE POSITIVES"},{"t":"Anomaly types: statistical, knowledge-based (expert rules), machine learning"}]},{"t":"Host-based IDS (HIDS)","mn":"System calls, logs, file hashes, registry","items":[{"t":"An extra security layer on sensitive hosts; anomaly or signature"},{"t":"Data source: system call traces (OS calls made by a process)"},{"t":"Data source: audit (log) records (Windows/Linux logs)"},{"t":"Data source: file integrity checksums (HASHING); malware changes the hash"},{"t":"Data source: registry access (Windows registry changes)"},{"t":"Distributed HIDS: agents report to a central manager"}]},{"t":"Network-based IDS (NIDS)","mn":"Inline can block; passive watches a copy","items":[{"t":"Monitors traffic at selected points, near real time, including protocol activity"},{"t":"Inline sensor: IN the path, can block. Risk: a bottleneck"},{"t":"Passive sensor: monitors a COPY of the traffic (a tap); no performance hit"},{"t":"Stateful protocol analysis: compares to benign protocol profiles and tracks states (heavy on resources)"},{"t":"Alert logging: timestamp, session ID, type, protocols, IPs/ports, bytes, payload"},{"t":"IDMEF is the standard alert exchange format"}]},{"t":"Honeypots","mn":"Fake honey jar: only a bear touches it","items":[{"t":"Decoy systems with fabricated information and NO production value, so any use is suspicious"},{"t":"Purpose: divert attackers from critical systems, collect information, keep them busy until admins respond"},{"t":"Low interaction: emulates a few services; low risk"},{"t":"High interaction: real systems; richer data but more risk"},{"t":"Practical: virtual honeypot demo (screen video, name + student number)"}]},{"t":"Snort","mn":"Header (action, protocol, addresses, ports, direction) + options","items":[{"t":"Open-source, lightweight, rule-based NIDS / IPS"},{"t":"A rule has a HEADER (action, protocol, source address and port, direction, destination address and port) and OPTIONS in brackets","r":"CH8 S41","g":"add","n":"Header field list read from the Snort rule format slide."},{"t":"Table 8.3: the eight Snort rule actions","b":"t83","r":"CH8 S42","g":"add","n":"Descriptions read from the Table 8.3 slide image."},{"t":"Example shape (illustrative): alert tcp any any -> 192.168.1.0/24 80 (msg:\"web probe\"; content:\"/etc/passwd\";)","d":"Read left to right: action, protocol, source address, source port, direction arrow, destination address, destination port, then options.","g":"gen","n":"This sample rule is mine to show the layout. It is not from the slides."}]}]},{"n":9,"title":"Firewalls & Intrusion Prevention","short":"Firewalls / IPS","hue":192,"mn":"Firewall = bouncer at the one door. IDS = camera. IPS = guard who can act.","br":[{"t":"The need for firewalls","mn":"Single choke point","items":[{"t":"An effective way to protect LANs: a controlled link between the premises network and the Internet"},{"t":"Single choke point: perimeter defence that imposes security and auditing"},{"t":"Design goal 1: ALL traffic (in ↔ out) must pass through the firewall"},{"t":"Design goal 2: ONLY authorised traffic (defined by policy) may pass"},{"t":"Design goal 3: the firewall itself is IMMUNE to penetration (hardened system, secure OS)"}]},{"t":"Access policy & filters","mn":"From the risk assessment + security policy","items":[{"t":"Access policy: the types of traffic authorised to pass"},{"t":"Filter on IP address and protocol values (limit access to services)"},{"t":"Filter on application protocol (used by gateways)"},{"t":"Filter on user identity (inside users authenticated)"},{"t":"Filter on network activity (time, rate of requests)"}]},{"t":"Capabilities & limitations","mn":"Cannot stop what bypasses it","items":[{"t":"Capability: a single choke point"},{"t":"Capability: a location for monitoring security events"},{"t":"Capability: a platform for non-security Internet functions (NAT, logging)"},{"t":"Capability: a platform for IPSec (VPN)"},{"t":"Limitation: cannot protect against attacks that BYPASS it"},{"t":"Limitation: not fully effective against INTERNAL threats"},{"t":"Limitation: an improperly secured WLAN accessed from outside"},{"t":"Limitation: portable storage and laptops infected outside (BYOD)"}]},{"t":"Packet filtering firewall","mn":"No memory: each packet judged alone","items":[{"t":"Rules applied to EACH IP packet using the IP/TCP header (source/destination IP, ports, protocol field)"},{"t":"Default policy DISCARD: prohibit unless permitted (SAFER)"},{"t":"Default policy FORWARD: permit unless prohibited"},{"t":"Advantages: simple, transparent, very fast"},{"t":"Disadvantages: cannot stop app-specific attacks, limited logging, no advanced user authentication, vulnerable to TCP/IP spoofing"}]},{"t":"Stateful inspection firewall","mn":"Remembers the conversation","items":[{"t":"Keeps a directory of outbound TCP connections (one entry per connection)"},{"t":"Allows incoming traffic to high ports ONLY if it matches an entry"},{"t":"Tracks TCP sequence numbers"},{"t":"A packet filter has NO memory. A stateful firewall remembers the conversation"}]},{"t":"Application-level gateway (proxy)","mn":"Reads the letter","items":[{"t":"Relays application traffic: User → gateway (user authenticated) → application"},{"t":"Needs proxy code for EACH application; more secure"},{"t":"Disadvantage: extra processing overhead per connection"}]},{"t":"Circuit-level gateway","mn":"Checks the envelope only","items":[{"t":"Relays TCP segments from one connection to another WITHOUT examining contents"},{"t":"Checks that the handshake is legitimate, NOT the payload"},{"t":"Can be application-level for inbound and circuit-level for outbound"},{"t":"SOCKS v5 is a common circuit-level framework"}]},{"t":"Firewall basing","mn":"Bastion, host-based, personal","items":[{"t":"Bastion host: a critical strong point on the network boundary; runs proxies; a hardened central control point"},{"t":"Host-based firewall: secures an individual host (OS or add-on); rules specific to that host; independent of network topology"},{"t":"Personal firewall: controls traffic between a PC and the Internet; a software module or in a home router; denies unauthorised INBOUND access"}]},{"t":"Locations & topologies","mn":"DMZ = hotel lobby","items":[{"t":"Configurations: host-resident firewall, screening router, single bastion inline, single bastion T, double bastion inline / T, distributed firewall"},{"t":"DMZ (demilitarised zone): a segment between the Internet and the internal network holding externally visible servers (web, email, DNS)","f":"dmz","d":"The public can enter the lobby, but staff rooms are behind another door."},{"t":"VPN: IPSec in firewalls/routers; encrypted tunnels across the Internet between sites or from a remote user"}]},{"t":"Intrusion prevention (IPS)","mn":"IDS = camera. IPS = guard.","items":[{"t":"An extension of IDS that can BLOCK or prevent detected malicious activity"},{"t":"Can be host-based, network-based or hybrid"},{"t":"Detection: anomaly (not legitimate use) or signature/heuristic (known malicious)"},{"t":"Blocks traffic like a firewall but uses IDS-style algorithms to decide"}]},{"t":"Host-based IPS (HIPS)","mn":"Typically protects desktops","items":[{"t":"Signature: content of app network traffic or system-call sequences matching malicious patterns"},{"t":"Anomaly: behaviour patterns that indicate malware"},{"t":"Malicious behaviour: privilege escalation, buffer overflow, modifying system resources"},{"t":"Sandbox approach: quarantines code in an isolated area, runs it and monitors behaviour"},{"t":"Role: integrates endpoint security into ONE suite (tools work together, easier management)"}]},{"t":"Network-based IPS (NIPS)","mn":"An inline NIDS with authority to act","items":[{"t":"A dedicated device at the network boundary; filters traffic between network segments"},{"t":"An inline NIDS with authority to modify or discard packets and tear down TCP connections"},{"t":"Pattern matching: known byte sequences (signature)"},{"t":"Stateful matching: a signature in the context of the traffic STREAM"},{"t":"Protocol anomaly: compared against standard protocol definitions"},{"t":"Traffic anomaly: unusual traffic activity"},{"t":"Statistical anomaly: profiles of normal traffic; flag deviations"}]},{"t":"UTM, Snort Inline, immune system","mn":"All-in-one, replace-not-drop, global view","items":[{"t":"UTM (Unified Threat Management): a single appliance with firewall, VPN, anti-spam, web filtering, bandwidth shaping and intrusion prevention","d":"Raw traffic passes through each module in turn and comes out clean and controlled."},{"t":"Snort Inline: Snort as an IPS. The REPLACE option modifies packets rather than dropping them","d":"Useful in a honeypot: the attacker sees the attack fail and cannot work out why."},{"t":"Digital immune system: a comprehensive defence against malware with faster propagation and a GLOBAL view","d":"Success depends on malware analysis that detects NEW strains. Flow (Fig 9.5): sensors detect, forward to analysis, sandbox, patch, update clients."}]}]},{"n":10,"title":"Buffer Overflow","short":"Buffer overflow","hue":318,"mn":"More data than the buffer holds. Writes run LOW → HIGH, toward the return address.","br":[{"t":"What is it?","mn":"A programming ERROR: data written beyond a fixed-size buffer","items":[{"t":"NIST: more input is placed in a buffer than its capacity, overwriting other information"},{"t":"Buffer = allocated memory space. Overflow = too much data"},{"t":"The buffer can be on the stack, the heap, or in global data"},{"t":"Consequence: corruption of program data"},{"t":"Consequence: unexpected transfer of control"},{"t":"Consequence: memory access violation"},{"t":"Consequence: execution of ATTACKER-CHOSEN code","d":"A 2-litre bottle into a 1-litre glass: the spill hits whatever sits next to it."}]},{"t":"Example & finding targets","mn":"strcpy copies with no check","items":[{"t":"source[] = \"username12\" is 10 characters + null = 11 bytes; destination[7] holds only 6 + null; strcpy copies with no check, so it overflows","d":"The 4 extra bytes land in whatever sits next to the destination buffer.","r":"CH10 S7"},{"t":"Attackers find vulnerable programs by inspecting source code (look for unsafe functions)"},{"t":"...or by tracing execution with oversized input"},{"t":"...or by fuzzing: automatic random or oversized input"},{"t":"Prevention: get rid of UNSAFE functions and use updated bounded versions"}]},{"t":"Languages & memory","mn":"C is exposed. Java and Python check ranges.","items":[{"t":"C and similar languages are VULNERABLE (efficiency over safety, legacy unsafe code)"},{"t":"Java and Python (modern high-level) are NOT vulnerable (range checks), at a run-time cost"},{"t":"Assembly: total control means total responsibility"},{"t":"Process memory: the stack sits at the top and grows DOWN toward lower addresses; the heap grows UP","f":"mem","g":"fix","r":"CH10 S14 (Fig 10.4)","n":"The friend wrote 'data written from HIGHER to LOWER addresses'. That mixes two things: the stack GROWS toward lower addresses, but a buffer write runs from LOW to HIGH addresses, which is what reaches the return address."}]},{"t":"Stack buffer overflow","mn":"Overwrite the return address","items":[{"t":"The buffer is on the stack. Used by the Morris worm"},{"t":"Stack frame, from high to low address: parameters, return address, old frame pointer, local variables / buffer","f":"stack"},{"t":"Attack: write past the buffer, overwrite the saved frame pointer, then the RETURN ADDRESS, so the function returns into attacker code","d":"Like rewriting the 'go back to' sticky note to say 'go to MY code'."},{"t":"Order matters: the buffer sits BELOW the return address, and writes go low → high"}]},{"t":"Shellcode","mn":"Attacker-supplied code, usually inside the buffer","items":[{"t":"Code SUPPLIED BY THE ATTACKER, often stored in the overflowed buffer"},{"t":"Traditionally gives a shell with the program's privileges"},{"t":"Machine code, so processor and OS specific"},{"t":"Must be position independent (it cannot assume where it loads)"},{"t":"NOP sled: a run of no-ops so an imprecise return address still lands on the code"},{"t":"Tools such as Metasploit automate it"}]},{"t":"Unsafe C routines","mn":"Unsafe → safer","items":[{"t":"gets → fgets"},{"t":"strcpy → strncpy or strlcpy"},{"t":"strcat → strncat or strlcat"},{"t":"sprintf → snprintf"},{"t":"scanf / fscanf → use a width limit"}]},{"t":"History","mn":"From Morris to Sasser","items":[{"t":"1988 Morris worm (fingerd). 1996 Aleph One, 'Smashing the Stack for Fun and Profit'"},{"t":"2001 Code Red (IIS). 2003 Slammer (SQL Server). 2004 Sasser (LSASS)"},{"t":"Still a concern: legacy buggy code and careless programmers"}]},{"t":"Compile-time defences","mn":"Harden NEW programs","items":[{"t":"Modern high-level language: range checks. Cost: run-time checks and no low-level access"},{"t":"Safe coding: inspect and rewrite unsafe code (OpenBSD audited everything)"},{"t":"Safe libraries, for example Libsafe, loaded before the standard libraries; needs recompiling"},{"t":"Stackguard: a CANARY value placed next to the return address; a changed canary aborts the program","d":"Canary in the coal mine: an overflow must trample it BEFORE the return address. It must be unpredictable."},{"t":"Stackshield / RAD: keep a COPY of the return address in safe memory and compare on exit"}]},{"t":"Run-time defences","mn":"Detect and ABORT attacks in EXISTING programs","items":[{"t":"Non-executable address space: mark stack and heap non-executable (MMU support); stops injected shellcode"},{"t":"ASLR (address space layout randomisation): a random shift of stack, heap, global data and library locations per process"},{"t":"Guard pages: illegal pages between memory regions; any access aborts the process (cost: page mappings)"},{"t":"Compile-time = new programs. Run-time = existing programs"}]},{"t":"Other overflow types","mn":"Each has its own defence","items":[{"t":"Replacement stack frame: the overflow also replaces the frame pointer and the attacker supplies a fake frame. Defence: stack protection"},{"t":"Return to system call: the return address points to an existing library function (e.g. system()) with attacker arguments; works on non-executable stacks. Defence: ASLR, block unsafe functions"},{"t":"Heap overflow: a buffer in the heap with no return address; overwrites heap data or function pointers. Defence: non-executable or randomised heap"},{"t":"Global data overflow: overwrites a function pointer in global data. Defence: randomise, guard pages, move pointers"},{"t":"Practical: GDB"}]}]},{"n":11,"title":"Software Security","short":"Software security","hue":140,"mn":"Never trust input: size, type, syntax, encoding, signed/unsigned. Least privilege.","br":[{"t":"Big picture","mn":"No flaw, no attack","items":[{"t":"5 critical web-app flaws: unvalidated input, cross-site scripting (XSS), buffer overflow, injection flaws, improper error handling"},{"t":"Root cause: INSUFFICIENT checking and validation of data and error codes"},{"t":"CWE/SANS error bucket 1: Insecure interaction between components (SQLi, XSS, CSRF)"},{"t":"Bucket 2: Risky resource management (buffer overflow, path traversal, integer overflow)"},{"t":"Bucket 3: Porous defences (missing authentication or encryption, hard-coded credentials)","d":"Memory aid: I-R-P.","b":"t111","r":"CH11 Table 11.1","g":"add","n":"Full category lists read from the Table 11.1 slide image (CWE/SANS Top 25, 2011)."}]},{"t":"Reduce vulnerabilities","mn":"Stop, find, reduce","items":[{"t":"NISTIR 8151: STOP vulnerabilities before they occur (better methods)"},{"t":"FIND them before they are exploited (testing, scanners)"},{"t":"REDUCE the impact (resilient architecture)"},{"t":"Reliability = ACCIDENTAL failure and random input. Security = DELIBERATE exploitation, where the attacker picks the input","d":"A clumsy person tripping versus a burglar going for the loose window."}]},{"t":"Defensive programming","mn":"NEVER ASSUME ANYTHING","items":[{"t":"Keep working even under attack or error"},{"t":"Zero-based trust: validate every assumption and handle every error state"},{"t":"Use checklists; design security in from the start (SAFECode)"},{"t":"Conflicts with business pressure for short development time"}]},{"t":"Handling program input","mn":"Treat ALL input as dangerous","items":[{"t":"Input = any data from outside the program"},{"t":"Size: an assumed maximum with an unchecked buffer gives an overflow"},{"t":"Interpretation: binary vs text, many character sets","d":"Heartbleed (2014): an unchecked length field."},{"t":"Validate syntax by comparing to an ALLOW-list (known good), which is safer than a deny-list"},{"t":"Alternate encodings (Unicode / UTF-8) can hide bad characters, so canonicalise: convert to ONE standard form first"}]},{"t":"Numeric input & fuzzing","mn":"Signed vs unsigned defeats checks","items":[{"t":"Numbers are fixed-size, signed or unsigned"},{"t":"Worked example: length 186 + 1 = 187 = 10111011 in 8 bits. Read as unsigned it is 187. Read as signed, the top bit makes it NEGATIVE","d":"Two's complement gives 187 − 256 = −69. Sign-magnitude gives −59 (the slide's value). Either way the number is negative, so the check if (size \u003c= 50) PASSES although the real input is huge.","g":"fix","n":"The friend wrote -69 and flagged that the slide says -59. Both are right under different signed formats (checked by hand: 187-256 = -69; sign-magnitude 0111011 = 59). Do not lose marks on the number; the point is that a negative passes \u003c= 50."},{"t":"Fix: use consistent types and validate ranges, including negatives"},{"t":"Fuzzing: randomly generated input to find crashes (Barton Miller, 1989)","d":"Cheap and assumption-free, but it misses some bugs, so combine approaches."}]},{"t":"Injection attacks","mn":"Input data influences the FLOW OF EXECUTION","items":[{"t":"SQL injection: user input pasted into SQL; the attacker extends it (for example with ; and another command). Defence: validate/escape; prepared statements"},{"t":"PHP code injection: include $path.'functions.php' with an attacker URL in the path"},{"t":"OS command injection: input reaches a shell command"},{"t":"Cross-site scripting (XSS): script input from ONE user is shown to ANOTHER and runs in their browser","d":"Exploits trust: all content from a site is treated equally. Defence: validate input, escape output. Graffiti with a booby-trap on a public wall."}]},{"t":"Writing safe code","mn":"Algorithm, machine code, data, memory, races","items":[{"t":"Correct algorithm: handle ALL variants; remove debug and maintenance hooks and easter eggs before release","d":"Example from the slides: TCP sequence numbers used as both identifier AND authenticator."},{"t":"Machine code matches the algorithm: a compiler could be hacked; only high-assurance (CC level 7) checks"},{"t":"Correct data interpretation: strong typing is safer"},{"t":"Correct memory use: a memory leak is a steady heap loss until exhausted"},{"t":"Race conditions: shared values corrupted without synchronisation; deadlock leads to DoS"}]},{"t":"Interacting with the OS","mn":"Least privilege","items":[{"t":"Environment variables are inherited by processes, so they are UNTRUSTED input (local user vs privileged program)"},{"t":"Least privilege: root programs are major targets; use privilege only when needed; split into small modules"},{"t":"System calls and libraries: assumptions can be wrong; buffering means you must flush and sync to really shred a file"},{"t":"Race on shared resources: use a lockfile; all programs must cooperate"},{"t":"Safe temp files: the process ID is predictable, so use RANDOM names"},{"t":"Other programs: older programs were not built with security in mind"}]},{"t":"Handling output","mn":"Validate input AND escape output","items":[{"t":"Output may be stored, sent or displayed; one operation's output is another's input"},{"t":"It must match the EXPECTED form and interpretation"},{"t":"Identify permissible content and FILTER untrusted data"},{"t":"Specify the character set"},{"t":"Validate input AND escape output"}]}]},{"n":13,"title":"Cloud & IoT Security","short":"Cloud & IoT","hue":232,"mn":"IaaS ⊂ PaaS ⊂ SaaS: the higher you go, the more the provider manages. Fog sits near the sensors; cloud sits in the centre.","br":[{"t":"What is cloud computing?","mn":"On-demand access to a SHARED POOL of resources","items":[{"t":"NIST SP 800-145: a model for ubiquitous, convenient, ON-DEMAND network access to a SHARED POOL of configurable resources, rapidly provisioned with MINIMAL management effort","r":"CH13 S4"},{"t":"Composed of 5 essential characteristics, 3 service models, 4 deployment models","r":"CH13 S4","g":"add","n":"The count is on slide 4. The slide does not list the five."},{"t":"The five characteristics: broad network access, rapid elasticity, measured service, on-demand self-service, resource pooling","g":"gen","n":"These are the NIST SP 800-145 characteristics from general knowledge. The lecturer's slides state the number five but do not list them, so do not expect to be marked on the list."},{"t":"Not brand new: hosted services, ASPs, distributed and grid computing","r":"CH13 S5"}]},{"t":"Core expectations","mn":"Someone else's problem, with better reliability","items":[{"t":"Self-monitoring and self-healing"},{"t":"Automation 'galore'"},{"t":"Self service"},{"t":"Pay only for what you use"},{"t":"Greater reliability and availability than older technologies"},{"t":"Still client-server, DISTRIBUTED computing; you make it someone else's problem"}]},{"t":"Service models","mn":"IaaS, PaaS, SaaS","items":[{"t":"IaaS: virtual hosted servers and machines, pay-as-you-go, self-service, high availability, VM upload/download, self-healing. Example: Amazon Web Services"},{"t":"PaaS: for developers; build apps without buying dev/test/production infrastructure. Examples: Google App Engine, Microsoft Azure"},{"t":"SaaS: used daily without thinking. Examples: Gmail, Drive, Office365, Dropbox"},{"t":"Others: STaaS, SECaaS, DaaS (data / desktop), BPaaS, TEaaS, APIaaS"}]},{"t":"Who manages what?","mn":"Higher up = provider manages MORE, you control LESS","items":[{"t":"Fig 13.2 separation of responsibilities by service model","b":"tresp","r":"CH13 S18, S32","d":"IaaS: customer = apps, data, runtime, middleware, OS. PaaS: customer = apps and data only. SaaS: provider manages everything.","g":"add","n":"Layer split read from the slide figures."},{"t":"CSA reference model: IaaS ⊂ PaaS ⊂ SaaS (each sits on top of the one below)"}]},{"t":"Deployment models & actors","mn":"Private, Public, Hybrid, Community","items":[{"t":"Private: one organisation, the MOST secure"},{"t":"Public: open to anyone using that provider"},{"t":"Hybrid: public and private together"},{"t":"Community: shared by organisations with common interests"},{"t":"Table 13.1: comparison of the four deployment models","b":"t131","r":"CH13 S19","g":"add","n":"Values read from the slide text."},{"t":"Actors (Fig 13.4): cloud consumer, cloud provider, carrier (the network link), broker (intermediary), auditor"}]},{"t":"Cloud security issues","mn":"Shared responsibility","items":[{"t":"Security is a major consideration; concerns often block migration"},{"t":"Availability and auditability of data must be ensured"},{"t":"Cloud USERS remain responsible for application-level security"},{"t":"Cloud VENDORS are responsible for physical security and some software security"},{"t":"The intermediate layers of the stack are SHARED responsibility"},{"t":"Providers must guard against theft/DoS by their users and protect users from one another"},{"t":"Table 13.2 NIST guidelines summary: governance, compliance, trust, architecture, identity and access management, software isolation, data protection, availability, incident response","r":"CH13 S21","g":"add","n":"List read from the slide."}]},{"t":"CSA threats: 1-3","mn":"Abuse, Interfaces, Insiders","items":[{"t":"Abuse and nefarious use of cloud computing","d":"Countermeasures: stricter initial registration and validation; enhanced credit-card fraud monitoring and coordination; comprehensive inspection of customer network traffic; monitoring public blacklists for one's own network blocks.","r":"CH13 S24"},{"t":"Insecure interfaces and APIs","d":"Countermeasures: analyse the CSP interface security model; strong authentication, access control and encryption; understand the API dependency chain."},{"t":"Malicious insiders","d":"Countermeasures: strict supply chain management; HR requirements in the legal contract; transparency and compliance reporting; a breach notification process."}]},{"t":"CSA threats: 4-7","mn":"Shared tech, Data loss, Hijacking, Unknown risk","items":[{"t":"Shared technology issues","d":"Countermeasures: security best practices for install/config; monitor for unauthorised changes; strong authentication for admins; SLAs for patching; vulnerability scans and configuration audits."},{"t":"Data loss or leakage","d":"Countermeasures: strong API access control; encrypt and protect integrity of data in transit and at rest; analyse data protection at design and run time; strong key generation, storage, management and destruction.","g":"fix","r":"CH13 S28","n":"The friend's notes only listed four of the seven CSA threats. This and the next two were missing."},{"t":"Account or service hijacking","d":"Countermeasures: prohibit sharing of account credentials between users and services; strong two-factor authentication where possible; proactive monitoring for unauthorised activity; understand CSP security policies and SLAs.","g":"fix","r":"CH13 S29","n":"Missing from the friend's notes."},{"t":"Unknown risk profile","d":"Countermeasures: disclosure of applicable logs and data; partial or full disclosure of infrastructure details; monitoring and alerting on necessary information.","g":"fix","r":"CH13 S30","n":"Missing from the friend's notes."}]},{"t":"Data protection & OpenStack","mn":"Multi-instance vs multi-tenant","items":[{"t":"Multi-instance: a uniquely running VM instance per subscriber; complete control over roles and authorisation"},{"t":"Multi-tenant: a predefined environment SHARED with other tenants; data is TAGGED with a subscriber ID; the customer relies on the PROVIDER for a sound, secure database"},{"t":"OpenStack: an open-source cloud OS that creates and manages large groups of virtual private servers; multi-tenant IaaS; simple and massively scalable"},{"t":"Cloud security as a service (SECaaS) is also on the summary slide"}]},{"t":"Internet of Things (IoT)","mn":"Sensor, actuator, microcontroller, transceiver, RFID","items":[{"t":"The expanding interconnection of SMART devices (appliances to tiny sensors); people-things and thing-thing communication, usually via the cloud; driven by deeply EMBEDDED devices"},{"t":"Components (Fig 13.8): sensor, actuator, microcontroller, transceiver, RFID"},{"t":"Edge: IoT devices (sensors + actuators). A gateway translates protocols and may aggregate data"},{"t":"Fog: do as much processing as possible near the sensors","d":"Evaluation, formatting, expanding/decoding, distillation/reduction, assessment. Fog hovers low to the ground; clouds are high in the sky."}]},{"t":"Cloud vs fog","mn":"Centre vs edge","items":[{"t":"Table 13.4: comparison of cloud and fog features","b":"t134","r":"CH13 S39","g":"add","n":"Values read from the slide text."},{"t":"Fog is the opposite trend to cloud: many small smart objects with local storage and processing"}]},{"t":"IoT security","mn":"Six ITU-T Y.2066 requirements","items":[{"t":"ITU-T Y.2066: communication security, data management security, service provision security, integration of security policies and techniques, mutual authentication and authorisation, security audit","r":"CH13 S41","g":"add","n":"Count of six read from the slide."},{"t":"Security framework elements (Fig 13.10): constrained (C) and unconstrained (U) devices, gateways (G), platforms (A)"},{"t":"Patching IoT devices is hard (summary topic: 'the patching vulnerability')"},{"t":"MiniSec: an open-source module in TinyOS; LINK-level; low energy and very little memory"},{"t":"MiniSec goals: confidentiality, data authentication, replay protection, freshness (message age), resilience to lost messages"},{"t":"MiniSec has 2 modes: single-source and multi-source broadcast"}]}]}]</script>
<script>
(function(){'use strict';
  var chapters=JSON.parse(document.getElementById('course-data').textContent), all=[], deck=[], position=0, revealed=false;
  var $=function(id){return document.getElementById(id)};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  chapters.forEach(function(c){var o=document.createElement('option');o.value=String(c.n);o.textContent='Chapter '+c.n+' · '+c.title;$('chapter').appendChild(o);c.br.forEach(function(b){b.items.forEach(function(it,i){all.push({chapter:c.n,title:c.title,branch:b.t,number:i+1,total:b.items.length,item:it})})})});
  function prompt(text){var m=/^([^:]{2,60}):\s*(.+)$/.exec(text);if(m&&m[1].split(/\s+/).length<=8)return esc(m[1])+': <span class="blank">__________</span>';var words=text.match(/\S+/g)||[];if(words.length<3)return '<span class="blank">__________</span>';var cut=Math.min(4,Math.max(1,Math.floor(words.length/3)));return '<span class="blank">__________</span> '+esc(words.slice(cut).join(' '))}
  function render(){var x=deck[position], it=x.item, card=$('card');$('where').textContent='Chapter '+x.chapter+' · '+x.branch;$('count').textContent=(position+1)+' / '+deck.length;card.setAttribute('aria-pressed',String(revealed));card.setAttribute('aria-label',revealed?'Show question':'Reveal answer');var html='<span class="card-kicker">'+(revealed?'The answer':'Complete the note')+'</span><h2>'+esc(x.branch)+'</h2>';if(revealed){html+='<p class="answer">'+esc(it.t)+'</p>';if(it.d)html+='<p class="detail">'+esc(it.d)+'</p>';if(it.g){var labels={fix:'Corrected from the notes',add:'Added from slides',gen:'General knowledge or assumption; not on slides'};html+='<p class="meta note"><strong>'+esc(labels[it.g]||it.g)+'</strong>'+(it.n?' · '+esc(it.n):'')+'</p>'}if(it.r)html+='<p class="meta">Slide reference: '+esc(it.r)+'</p>';if(it.f||it.b||it.tool)html+='<p class="meta">This point has a diagram, table or interactive tool in the mindmap.</p>'}else html+='<p class="prompt">'+prompt(it.t)+'</p>';card.innerHTML=html+'<span class="hint">'+(revealed?'Tap to return to the question':'Tap to reveal the answer')+'</span>';$('flip').textContent=revealed?'Show question':'Reveal answer';$('previous').disabled=position===0;$('next').disabled=position===deck.length-1;$('source').href='COS330%20Security%20Mindmap.html#ch'+x.chapter}
  function reset(){var chosen=$('chapter').value;deck=all.filter(function(x){return chosen==='all'||String(x.chapter)===chosen});position=0;revealed=false;render()}
  function flip(){revealed=!revealed;render()}
  function move(n){position=Math.max(0,Math.min(deck.length-1,position+n));revealed=false;render()}
  $('chapter').addEventListener('change',reset);$('card').addEventListener('click',flip);$('flip').addEventListener('click',flip);$('previous').addEventListener('click',function(){move(-1)});$('next').addEventListener('click',function(){move(1)});$('shuffle').addEventListener('click',function(){for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=deck[i];deck[i]=deck[j];deck[j]=t}position=0;revealed=false;render()});document.addEventListener('keydown',function(e){if(/^(INPUT|SELECT|TEXTAREA|BUTTON|A)$/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}else if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}else if(e.key===' '){e.preventDefault();flip()}});reset();
})();
</script></body></html>
