<script id="deck-data" type="application/json">{"chapters":[{"n":1,"title":"Computer Security Overview"},{"n":2,"title":"Cryptographic Tools"},{"n":3,"title":"User Authentication"},{"n":4,"title":"Access Control"},{"n":5,"title":"Database & Data Center Security"},{"n":6,"title":"Malicious Software"},{"n":7,"title":"Denial-of-Service Attacks"},{"n":8,"title":"Intrusion Detection"},{"n":9,"title":"Firewalls & Intrusion Prevention"},{"n":10,"title":"Buffer Overflow"},{"n":11,"title":"Software Security"},{"n":13,"title":"Cloud & IoT Security"}],"cards":[{"c":1,"t":"Core definitions","q":"How does NIST define computer security?","a":["Measures and controls that protect the confidentiality, integrity and availability (C-I-A) of information system assets."],"d":"\"Assets\" means hardware, software, firmware and the information being processed, stored or communicated. Every later chapter is a way of protecting one of the three letters."},{"c":1,"t":"Core definitions","q":"What does confidentiality mean, and what is an example of breaching it?","a":["Only the right people can SEE the data (covers data confidentiality and privacy). Breach example: a leaked password file."]},{"c":1,"t":"Core definitions","q":"What does integrity mean, and what is an example of breaching it?","a":["Only the right people can CHANGE the data or system (covers data integrity and system integrity). Breach example: an attacker edits a bank balance."],"d":"Authenticity and non-repudiation hang off integrity."},{"c":1,"t":"Core definitions","q":"What does availability mean, and what is an example of breaching it?","a":["Timely, reliable access to data and services, on demand and usable. Breach example: a DoS attack takes the web server offline."],"d":"Chapter 7 is entirely about this letter."},{"c":1,"t":"Core definitions","q":"Besides C-I-A, which two extra security objectives does the course add, and what does each mean?","a":["Authenticity: you can verify that someone or something is who or what it claims to be.","Accountability: actions can be traced to one entity (needed for forensics and non-repudiation)."]},{"c":1,"t":"Core definitions","q":"What do the FIPS 199 impact levels Low, Moderate and High mean when a security breach occurs?","a":["Low = limited adverse effect. Moderate = serious adverse effect. High = severe or catastrophic adverse effect."],"d":"The level always depends on context. A leaked menu is Low; a leaked patient database is High.","n":"The Low/Moderate/High names are FIPS 199 as used again in Chapter 3. The one-line examples are mine."},{"c":1,"t":"Core definitions","q":"A system keeps running but gives wrong answers. Another leaks data to people who should not see it. A third is very slow or down. Which CIA property was lost in each?","a":["Corrupted (wrong answers) = INTEGRITY.","Leaky = CONFIDENTIALITY.","Unavailable or very slow = AVAILABILITY."],"d":"The four asset types these apply to are Hardware, Software, Data, and Communication facilities and networks."},{"c":1,"t":"Security vs usability","q":"Why is there always a trade-off between security and usability?","a":["Security measures such as passwords and tokens add friction for legitimate users, so stronger security usually means less convenience."]},{"c":1,"t":"Security vs usability","q":"Why is defence harder than attack?","a":["The attacker needs only ONE weakness, while the defender must close ALL of them, so defence is always playing catch-up."]},{"c":1,"t":"Security vs usability","q":"Why does a computer security course care about physical security?","a":["Physical security is as important as logical security. If someone can walk off with the server, the firewall does not matter."]},{"c":1,"t":"Vocabulary","q":"What is the difference between a vulnerability, a threat and an attack?","a":["Vulnerability: a weakness that could be exploited (a weakness, not an event).","Threat: the potential for harm. It has NOT happened yet.","Attack: a threat that is actually carried out."],"d":"Threat versus attack is the favourite definition to mix up in tests."},{"c":1,"t":"Vocabulary","q":"What is a countermeasure?","a":["Anything that reduces a vulnerability or impairs an attack."]},{"c":1,"t":"Vocabulary","q":"What is an adversary (threat agent)?","a":["An individual, group, organisation or government that conducts (or intends to conduct) harmful activity."]},{"c":1,"t":"Vocabulary","q":"Risk depends on which two factors, and why can two very different situations carry the same risk?","a":["Risk = f(impact if it happens, likelihood it happens)."],"d":"High impact with low likelihood and low impact with high likelihood can both land at the same risk level. This is why risk assessment ranks things."},{"c":1,"t":"Attacks","q":"Compare passive and active attacks. Which is harder to detect and which is harder to prevent?","a":["Passive: only observes, does not affect resources (release of message contents, traffic analysis). Hard to DETECT, easy to prevent.","Active: alters resources or operation (replay, masquerade, modifying messages, denial of service). Easy to detect, hard to PREVENT."],"d":"Passive attacks change nothing, so nothing looks wrong. Active damage is visible, but you cannot stop every attempt."},{"c":1,"t":"Attacks","q":"Why can traffic analysis leak information even when all messages are encrypted?","a":["The attacker still sees who talks to whom and how often, even though they cannot read what is said."],"n":"Explanation is general networking knowledge, not copied from the slides."},{"c":1,"t":"Attacks","q":"What is the difference between an insider and an outsider attacker?","a":["An insider attacks from inside the security perimeter; an outsider attacks from outside it."]},{"c":1,"t":"Threat consequences (RFC 4949)","q":"What are the four classes of threat consequence in RFC 4949, and what does each include?","a":["Unauthorised disclosure: exposure, interception, inference, intrusion.","Deception: masquerade, falsification, repudiation.","Disruption: incapacitation, corruption, obstruction.","Usurpation: misappropriation, misuse."],"d":"Usurpation means taking over control of a resource or using it for something it was not meant for."},{"c":1,"t":"Countermeasures","q":"What are the three things a countermeasure can do?","a":["Prevent, Detect, Recover."]},{"c":1,"t":"Countermeasures","q":"Why is 100% security never guaranteed, even with countermeasures?","a":["Residual vulnerabilities may remain, and a countermeasure can itself introduce new vulnerabilities. The goal is to minimise the residual level of risk to the assets."],"d":"Example of a countermeasure creating a vulnerability: a complex firewall rule set creates new misconfiguration risk.","r":"CH1 S15","n":"The slide point is real; the firewall example is mine."},{"c":1,"t":"Countermeasures","q":"FIPS 200 lists 17 minimum security requirement areas. Name as many as you can.","a":["Access control; Identification & authentication; Audit & accountability; Awareness & training; Personnel security; Certification, accreditation & security assessment; Configuration management; Contingency planning; Incident response; Maintenance; Media protection; Physical & environmental protection; Planning; Risk assessment; Systems & services acquisition; System & communications protection; System & information integrity."]},{"c":1,"t":"Countermeasures","q":"In FIPS 200, what is the core idea of these areas: access control, audit & accountability, configuration management, contingency planning?","a":["Access control: limit system access to authorised users and processes.","Audit & accountability: trace actions back to a user.","Configuration management: baselines and secure settings.","Contingency planning: backup and disaster recovery."]},{"c":1,"t":"Attack surface and attack trees","q":"What is an attack surface, and what are its three categories?","a":["The reachable and exploitable vulnerabilities in a system.","Network: open ports, protocols, services.","Software: code that processes incoming data (web, email, documents).","Human: staff open to social engineering."]},{"c":1,"t":"Attack surface and attack trees","q":"What is an attack tree?","a":["A branching diagram of ways to reach an attacker's goal. The root is the goal and the branches are sub-attacks (malware, brute-force PIN, man-in-the-middle, session hijack)."],"d":"Reducing the attack surface removes branches."},{"c":1,"t":"Security strategy","q":"What are the four parts of a security strategy?","a":["Security policy (formal rules for protecting resources) → Implementation (prevention, detection, response, recovery) → Assurance (confidence the measures work as intended) → Evaluation (examining a product against criteria, e.g. Common Criteria)."]},{"c":1,"t":"Security strategy","q":"Which standards body is responsible for what: NIST, ISOC, ITU-T, ISO?","a":["NIST: US federal measurement science and standards.","ISOC: Internet standards.","ITU-T: the UN telecom agency.","ISO: international standards."]},{"c":2,"t":"Symmetric encryption","q":"What is symmetric encryption, and what security service is it the universal technique for?","a":["The SAME secret key both encrypts and decrypts. It is the universal technique for CONFIDENTIALITY."],"d":"Plaintext and key go into the algorithm and ciphertext comes out. The same key reverses it. It needs a strong algorithm and a secret key shared securely."},{"c":2,"t":"Symmetric encryption","q":"What is the main weakness of symmetric encryption?","a":["KEY DISTRIBUTION: the two parties must somehow share the key securely first."],"d":"If the key is intercepted, the attacker decrypts everything. In the Alice, Bob and Mike example, if Mike intercepts the key K and the ciphertext, he reads the message too."},{"c":2,"t":"Symmetric encryption","q":"What is the difference between a block cipher and a stream cipher?","a":["Block cipher: processes one BLOCK at a time, producing one output block per input block.","Stream cipher: processes data continuously, byte by byte; faster; needs a good pseudorandom keystream."]},{"c":2,"t":"Symmetric encryption","q":"Why is ECB mode a weak way to use a block cipher?","a":["Identical plaintext blocks give identical ciphertext blocks, so patterns in the data leak."],"d":"Avoid it. Other modes of operation hide repeats."},{"c":2,"t":"Symmetric algorithms","q":"Give the block and key sizes of DES, 3DES and AES, and which is the current standard.","a":["DES: 64-bit block, 56-bit key. Weak and brute-forceable.","3DES: applies DES three times, 112 or 168-bit key. Slow.","AES: 128-bit block, 128 / 192 / 256-bit key. NIST 2001 (Rijndael). The current standard."]},{"c":2,"t":"Symmetric algorithms","q":"What happens to brute-force effort for each extra bit of key length?","a":["It DOUBLES (the search space is 2^n)."],"d":"That is exponential growth, so a modest increase in key length is an enormous increase in cracking time."},{"c":2,"t":"Symmetric algorithms","q":"How long does it take to brute-force a 56-bit key?","a":["About 1.125 years at 10^9 decryptions per second, but only about 1 hour at 10^13 decryptions per second (Table 2.2)."],"r":"Table 2.2","n":"The friend's note said \"56-bit: hours\". That is only true for the fast attacker."},{"c":2,"t":"Symmetric algorithms","q":"Roughly how long would brute-forcing a 128-bit key take at 10^9 decryptions per second?","a":["Around 5 × 10^21 years, far longer than the age of the universe."],"n":"My own arithmetic: 2^127 / 10^9 per second / seconds per year. Check Table 2.2 for the slide's exact figure."},{"c":2,"t":"Hash functions","q":"What does a hash function do, and what is it used to protect (secrecy or integrity)?","a":["It maps an input of any size to a FIXED-length digest, acting as a fingerprint. It gives INTEGRITY, not secrecy."]},{"c":2,"t":"Hash functions","q":"What are the six properties of a cryptographic hash function?","a":["1. Accepts variable-size input. 2. Produces fixed-size output. 3. Easy to compute. 4. Pre-image resistant (one-way). 5. Second pre-image resistant. 6. Collision resistant."],"n":"The friend's list was missing second pre-image resistance. The slides give six properties."},{"c":2,"t":"Hash functions","q":"What is the difference between pre-image, second pre-image and collision resistance?","a":["Pre-image: given a hash h, you cannot find any x with H(x) = h.","Second pre-image: given x, you cannot find a different y with H(y) = H(x).","Collision: you cannot find ANY pair x, y that hash to the same value."]},{"c":2,"t":"Hash functions","q":"Why does a one-bit change in a message make a hash good for detecting tampering?","a":["A 1-bit change in the input gives a completely different hash, so any modification is visible."],"n":"Standard hash behaviour (avalanche effect); not stated in these words on the slides."},{"c":2,"t":"Hash functions","q":"Name common hash algorithms and which ones are considered weak today.","a":["MD5, SHA-1, SHA-2 / SHA-256. MD5 and SHA-1 are considered broken today."],"n":"\"Weak\" for MD5/SHA-1 is general knowledge, not from the slides."},{"c":2,"t":"Hash functions","q":"What are hash functions used for in this course?","a":["Password storage (store H(password) instead of the password), file integrity checks, and digital forensics."]},{"c":2,"t":"MAC vs hash","q":"What is a MAC and what does it provide?","a":["A short tag computed from a message plus a shared secret key. It gives integrity AND authenticity."]},{"c":2,"t":"MAC vs hash","q":"Why can a plain hash not authenticate a message, but a MAC can?","a":["A hash has no key, so anyone can compute it. An attacker can alter the message and recompute the hash. With a MAC they cannot, because they lack the secret key."]},{"c":2,"t":"MAC vs hash","q":"Does a MAC provide non-repudiation? Why or why not?","a":["No. Both sides share the key, so either of them could have produced the tag. Digital signatures fix that."],"n":"Reasoning from the shared-key property; the slide summary only says Signature = + non-repudiation."},{"c":2,"t":"Public-key (asymmetric) cryptography","q":"In public-key cryptography, what is each key used for?","a":["Public key: shared with anyone; used to ENCRYPT or to VERIFY a signature.","Private key: kept secret; used to DECRYPT or to SIGN."],"d":"What one key locks, only its PAIR unlocks."},{"c":2,"t":"Public-key (asymmetric) cryptography","q":"Why does public-key cryptography solve the key distribution problem, and what does it cost?","a":["The private key never travels, so nothing secret has to be shared in advance. The cost is speed: asymmetric operations are much slower than symmetric ones."],"d":"That cost is why the digital envelope exists."},{"c":2,"t":"Public-key (asymmetric) cryptography","q":"Which algorithms (RSA, Diffie-Hellman, DSS, Elliptic Curve) can do digital signatures, symmetric key distribution and encryption of secret keys?","a":["RSA and Elliptic Curve do all three. DSS does digital signatures only. Diffie-Hellman does symmetric key distribution only (no signature, no encryption of secret keys)."],"r":"CH2 S33 (Table 2.3)","n":"The friend had the Diffie-Hellman row wrong (signature yes, key distribution NO). On slide 33 Diffie-Hellman is signature NO, key distribution YES, encryption of secret keys NO."},{"c":2,"t":"Digital signatures","q":"What three things does a digital signature give you (NIST FIPS 186-4)?","a":["Origin authentication, data integrity and signatory non-repudiation."]},{"c":2,"t":"Digital signatures","q":"How is a digital signature created and verified?","a":["Sign: hash the document, then encrypt the hash with your PRIVATE key.","Verify: decrypt the signature with the sender's PUBLIC key and compare the result with a fresh hash of the document."],"d":"If the two hashes match, the document is unchanged and the signer held the private key."},{"c":2,"t":"Digital signatures","q":"Why does a signature give non-repudiation when a MAC does not?","a":["Only the sender has the private key, so only they could have signed. They cannot deny it."]},{"c":2,"t":"Digital envelope","q":"What is a digital envelope and why is it used?","a":["The message is encrypted with a fast symmetric key, and THAT key is encrypted with the receiver's public key. You get the speed of symmetric encryption and the key-distribution benefit of asymmetric."],"d":"The receiver unwraps the symmetric key with their private key, then decrypts the long message with it."},{"c":2,"t":"Random numbers and stored data","q":"Where are random numbers used in cryptography?","a":["Keys, session keys, stream-cipher keystreams and handshakes (to prevent replay)."]},{"c":2,"t":"Random numbers and stored data","q":"What is the difference between true random and pseudorandom numbers?","a":["True random: unpredictable and independent. Pseudorandom: produced by an algorithm but passes statistical tests for randomness."]},{"c":2,"t":"Random numbers and stored data","q":"Why is encrypting stored data less common than encrypting data in transit?","a":["Encryption of stored data interferes with access and searching."]},{"c":2,"t":"Random numbers and stored data","q":"Is a \"deleted\" file really gone?","a":["No. Deleted files are often recoverable until their disk sectors are overwritten."]},{"c":2,"t":"Worked example: double transposition","q":"How do you encrypt with a double columnar transposition, step by step?","a":["1. Take each key phrase, drop repeated letters, keep the first occurrence.","2. Number the key letters alphabetically (1 = earliest letter).","3. Write the text in rows under the key and read the columns in number order.","4. Pad short text with X.","5. Repeat the whole process with the second key."],"d":"To decrypt, undo the LAST key first. A calculator for this is in the mindmap.","r":"COS330 - ST1 Q4","n":"Procedure and answer are from the semester test's marked solution and re-checked by running the code. Which keyword counts as \"first\" is set by the question wording."},{"c":2,"t":"Summary","q":"Summarise which tool gives which security service: hash, MAC, digital signature, symmetric encryption.","a":["Symmetric encryption = confidentiality (one key; fast; key-distribution problem).","Hash = integrity only (no key).","MAC = integrity + authentication.","Digital signature = integrity + authentication + non-repudiation."],"d":"Encryption is reversible (confidentiality); hashing is one-way (integrity)."},{"c":3,"t":"Identification vs authentication","q":"What is the difference between identification and authentication?","a":["Identification: CLAIMING who you are (e.g. entering a username).","Authentication: PROVING it (password, token, biometric)."]},{"c":3,"t":"Identification vs authentication","q":"How does NIST SP 800-63-3 describe user authentication?","a":["Establishing confidence in electronically presented identities."]},{"c":3,"t":"Identification vs authentication","q":"Which authentication requirements does NIST SP 800-171 list?","a":["Multi-factor authentication for privileged accounts; replay-resistant mechanisms; no reuse of identifiers and disable inactive ones; minimum password complexity with periodic change; store and transmit only cryptographically protected passwords; OBSCURE feedback."]},{"c":3,"t":"Identification vs authentication","q":"Why should a login form say \"invalid username or password\" rather than \"wrong password\"?","a":["Obscure feedback: it never reveals which field was wrong. \"Wrong password\" would confirm to an attacker that the username exists."]},{"c":3,"t":"Four means of authentication","q":"What are the four means of authentication, with an example of each?","a":["KNOW (something you know): password, PIN, security questions.","HAVE (something you have, a token): smartcard, keycard, physical key.","ARE (static biometric): fingerprint, retina, face.","DO (dynamic biometric): voice, handwriting, typing rhythm."]},{"c":3,"t":"Four means of authentication","q":"What counts as multifactor authentication? Is using two passwords multifactor?","a":["Multifactor means 2 or more DIFFERENT factors. Two passwords is NOT multifactor, because both are \"know\"."],"d":"A bank card (have) plus a PIN (know) is multifactor."},{"c":3,"t":"Authentication risk assessment","q":"What three things does an authentication risk assessment consider?","a":["Assurance level, areas of risk, and potential impact."]},{"c":3,"t":"Authentication risk assessment","q":"What is an assurance level in SP 800-63-3?","a":["The confidence that the person is who they claim to be. There are 4 levels, from little confidence to very high confidence."]},{"c":3,"t":"Authentication risk assessment","q":"What potential impact categories apply if authentication fails (FIPS 199)?","a":["Inconvenience or reputation, financial loss, harm to programs, unauthorised release of sensitive information, personal safety, and civil or criminal violations, each rated Low / Moderate / High."],"r":"CH3 Table 3.2"},{"c":3,"t":"Password attacks","q":"What is an offline dictionary attack?","a":["The attacker steals the password file and tries dictionary words against it offline, with no lockouts or rate limits."]},{"c":3,"t":"Password attacks","q":"How many combinations does a brute-force attack on an 8-character password over 52 letters need?","a":["52^8 = 53,459,728,531,456, about 5.3 × 10^13. Adding digits (62 characters) makes it 62^8, about 2.2 × 10^14."],"d":"Combinations = (alphabet size) ^ (length).","n":"Arithmetic checked in code. The 52^8 case is the friend's example; the 62-character case is mine."},{"c":3,"t":"Password attacks","q":"Which raises password cracking time more: a bigger alphabet or a longer password?","a":["Both help hugely, but length is the stronger lever because it is the exponent."]},{"c":3,"t":"Salting","q":"What is salting and how does UNIX store it?","a":["A random salt is combined with the password BEFORE hashing. The password-file entry stores the salt together with the hash."]},{"c":3,"t":"Salting","q":"Two users choose the same password. Why do their stored hashes differ when salting is used?","a":["Each has a different random salt, so identical passwords hash DIFFERENTLY. Cracking one does not crack the other."]},{"c":3,"t":"Salting","q":"What is a rainbow table, and how does salting defeat it?","a":["A rainbow table is a precomputed hash → password lookup. With salting, the attacker would need one table per possible salt."]},{"c":3,"t":"Salting","q":"What does salting NOT protect against?","a":["Brute force against a single account."]},{"c":3,"t":"Protecting passwords","q":"How is the password file itself protected?","a":["Access control: the file is readable by privileged users only (the UNIX shadow password file)."]},{"c":3,"t":"Protecting passwords","q":"What are the three styles of proactive password checking?","a":["Rule enforcement (composition rules); a dictionary checker (a large do-not-use list); and a Bloom filter."]},{"c":3,"t":"Protecting passwords","q":"What is a Bloom filter and why is it used for password checking?","a":["A space-efficient hash table of bad passwords. It can say \"definitely not on the list\" or \"probably on the list\", so checking is fast and small."],"n":"Bloom filter behaviour is general computer science; the slides only name it as a space-efficient bad-password check."},{"c":3,"t":"Token-based authentication","q":"What is the difference between a memory card and a smart card?","a":["A memory card only stores data and does NOT process it (magnetic stripe, hotel key).","A smart card or token has an embedded MICROPROCESSOR (processor, memory, I/O)."]},{"c":3,"t":"Token-based authentication","q":"What are the three memory types in a smart card?","a":["ROM (permanent), EEPROM (programs and application data), RAM (working data)."]},{"c":3,"t":"Token-based authentication","q":"What authentication protocols can a smart card use?","a":["Static, dynamic password generator, and challenge-response."]},{"c":3,"t":"Token-based authentication","q":"What is an eID card?","a":["A smart card used as a national ID, carrying a government-verified identity."]},{"c":3,"t":"Biometrics","q":"What do biometrics authenticate and what are the main modalities?","a":["Unique physical characteristics, using pattern recognition. Examples: face, fingerprint, hand geometry, retina, iris, signature, voice. More complex and expensive than passwords, and needs a physical scanner."]},{"c":3,"t":"Biometrics","q":"What are the two phases of biometric authentication?","a":["Enrollment: capture and store a template. Verification: capture again and compare to the stored template."]},{"c":3,"t":"Remote authentication","q":"What extra threats exist when authentication happens over a network?","a":["Eavesdropping, password capture, and REPLAY of a previously seen sequence."]},{"c":3,"t":"Remote authentication","q":"How does challenge-response stop a replay attack?","a":["The server sends a changing challenge each time, so a recorded response cannot be reused."]},{"c":3,"t":"Exam note","q":"Which practicals are examinable for this chapter?","a":["The concepts from Practicals 1 to 3 are examinable."],"n":"Taken from the friend's lecture notes on the semester test scope."},{"c":4,"t":"What is access control?","q":"How does NISTIR 7298 define access control?","a":["Granting or denying requests to (1) obtain and use information and services, and (2) enter physical facilities."]},{"c":4,"t":"What is access control?","q":"What is the relationship between authentication and access control?","a":["Authenticate first (who are you?), then access control decides WHAT you may do."]},{"c":4,"t":"What is access control?","q":"How does RFC 4949 describe access control?","a":["Use of resources is regulated according to a security policy and permitted only to authorised entities."]},{"c":4,"t":"The four models","q":"What is DAC (discretionary access control)?","a":["Access is decided by identity plus access rules, and the OWNER of the resource decides who gets access."],"d":"Typical example: UNIX file permissions. Flexible, but a careless owner can give away too much."},{"c":4,"t":"The four models","q":"What is MAC (mandatory access control)?","a":["Security LABELS on objects are compared against CLEARANCES of subjects, and a central authority decides (military style). Users cannot change the labels on their own files."],"d":"Levels are nested, with a higher clearance able to read lower labels.","n":"The friend named the levels \"Top Secret > Secret > Private > Public\". Those exact names are not on the slides. Treat them as an illustration of ordered levels, not examinable wording."},{"c":4,"t":"The four models","q":"What is RBAC (role-based access control)?","a":["Access is based on the user's ROLE in the organisation, not on who they are individually."]},{"c":4,"t":"The four models","q":"What is ABAC (attribute-based access control)? Give an example rule.","a":["Access depends on attributes of the user, the resource and the environment."],"d":"Example: allow access only during business hours, from a company device, for someone in the right department."},{"c":4,"t":"Subjects, objects and rights","q":"What are a subject, an object and an access right?","a":["Subject: an entity able to access objects (a user or a process).","Object: a resource whose access is controlled (e.g. a file).","Access right: HOW a subject may access an object (read, write, execute, own)."]},{"c":4,"t":"Subjects, objects and rights","q":"In an access matrix, what does reading a column mean and what does reading a row mean?","a":["A COLUMN is the ACL for that object (who can access THIS file).","A ROW is that subject's capability list (what can THIS user access)."],"d":"Subjects are the rows and objects are the columns."},{"c":4,"t":"Subjects, objects and rights","q":"Where is an ACL stored, and where is a capability list stored?","a":["An ACL is stored per OBJECT. A capability list is stored per SUBJECT."]},{"c":4,"t":"Subjects, objects and rights","q":"What does the extended access control matrix add?","a":["Processes and disk drives as subjects/objects, and rights that can include a copy flag."]},{"c":4,"t":"UNIX file access control","q":"What is an inode in UNIX?","a":["The structure that manages a file's attributes, permissions and control information. One inode = one file, but many names can point to one inode, which is how hard links work."]},{"c":4,"t":"UNIX file access control","q":"How do traditional UNIX permissions work?","a":["User ID + group ID + 12 protection bits, including r/w/x for owner, group and other."]},{"c":4,"t":"UNIX file access control","q":"How do modern UNIX systems get finer-grained control?","a":["With ACLs (e.g. setfacl)."]},{"c":4,"t":"RBAC in detail","q":"In RBAC, to whom are rights granted, and what happens when someone changes job?","a":["Rights are granted to ROLES, and users are assigned to roles. A job change only changes the role assignment."]},{"c":4,"t":"RBAC in detail","q":"What is the relationship between users, roles and permissions in RBAC?","a":["Many-to-many both ways: users ↔ roles ↔ permissions."],"d":"Fig 4.7 shows this as two matrices (users against roles, then roles against objects), and roles can also be given rights over other roles, such as owner or control.","r":"CH4 S24"},{"c":4,"t":"ABAC in detail","q":"What is the strength and the main obstacle of ABAC?","a":["Strength: flexible and expressive. Obstacle: performance overhead of evaluating attribute predicates."]},{"c":4,"t":"ABAC in detail","q":"What are the three kinds of attributes in ABAC, with examples?","a":["Subject: identifier, name, organisation, job title, role.","Object: ownership, service taxonomy, QoS.","Environment: date/time, threat level, network type."]},{"c":4,"t":"ABAC in detail","q":"What is XACML?","a":["The standard for expressing ABAC policies (used for web services)."]},{"c":4,"t":"ICAM","q":"What is ICAM?","a":["The US-government approach: create digital identities, give them credentials, and use those to grant authorised access."]},{"c":4,"t":"ICAM","q":"What is identity management in ICAM?","a":["Attributes bound to a digital identity that is linked to a real person or an NPE (non-person entity). It must be trustworthy and independent of any one application."]},{"c":4,"t":"ICAM","q":"What are the five steps of credential management in ICAM, in order?","a":["1. Sponsorship (an authorised person sponsors the credential).","2. Enrollment (identity proofing, capture of biographic/biometric data).","3. Credential production (encryption, digital signature, smart card creation).","4. Issuance (given to the individual or NPE).","5. Maintenance (revocation, reissuance, expiry, PIN reset, suspension)."]},{"c":4,"t":"ICAM","q":"What are the three elements of ICAM access management?","a":["Resource management (rules for accessing a resource), privilege management (maintains entitlement/privilege attributes), policy management (what is allowable or unallowable in a transaction)."]},{"c":4,"t":"Identity federation","q":"What two problems does identity federation solve?","a":["How to trust identities issued by EXTERNAL organisations on YOUR systems, and how to vouch for YOUR people at external organisations."]},{"c":4,"t":"Identity federation","q":"Which identity federation frameworks does the course name?","a":["OpenID, OITF, OIDF, ICF, OIX, AXN."]},{"c":4,"t":"Summary","q":"Summarise the four access control models in one line each.","a":["DAC = owner's discretion. MAC = central labels and clearances. RBAC = job role. ABAC = attributes + context."]},{"c":5,"t":"Database background","q":"What is a relational database, and what do relation, tuple and attribute correspond to?","a":["Tables of rows and columns linked by shared keys, queried with SQL. Relation = table, tuple = row, attribute = column."]},{"c":5,"t":"Database background","q":"What is the difference between a primary key and a foreign key?","a":["A primary key uniquely identifies a row. A foreign key links one table to another."]},{"c":5,"t":"Database background","q":"What is a DBMS and what are its main parts?","a":["Programs to build and maintain the database, with ad hoc queries for many users. Parts: DDL processor, DML/query processor, authorisation table, file manager."]},{"c":5,"t":"Database background","q":"Why are database views useful for security?","a":["A view is a query result that limits what a user can see."]},{"c":5,"t":"SQL injection (SQLi)","q":"What is SQL injection and what is the attacker usually after?","a":["Malicious SQL hidden in normal-looking input. The usual goal is BULK data extraction."]},{"c":5,"t":"SQL injection (SQLi)","q":"What are the three steps of a classic SQLi technique?","a":["Prematurely TERMINATE a string, APPEND a command, and end with a -- comment."],"d":"The comment marker throws away whatever the programmer wrote after your input, such as the closing quote or a password check."},{"c":5,"t":"SQL injection (SQLi)","q":"Through which avenues can SQLi input arrive?","a":["User input, server variables (forged headers), second-order injection (stored, triggered later), cookies, and physical user input."]},{"c":5,"t":"SQL injection (SQLi)","q":"What are the three types of SQLi?","a":["In-band: the same channel is used to inject AND get results (tautology, end-of-line comment, piggybacked queries).","Inferential: no data is transferred; the attacker reconstructs information from server behaviour (illegal/incorrect queries, blind SQLi).","Out-of-band: data is retrieved through a DIFFERENT channel, for example emailed out."]},{"c":5,"t":"SQL injection (SQLi)","q":"What are the three groups of SQLi countermeasures?","a":["Defensive coding (secure coding, data-type validation, escaping); detection (check queries at run time against EXPECTED structures); run-time prevention (block or alter suspicious queries)."],"d":"Prepared statements are the standard coding fix and are covered again in Chapter 11.","n":"Linking to Chapter 11's prepared statements is my cross-reference."},{"c":5,"t":"Database access control","q":"Who controls access in ownership-based and decentralised database access control?","a":["Ownership-based: the creator of a table grants and revokes rights. Decentralised: the owner lets others grant and revoke on their behalf."]},{"c":5,"t":"Database access control","q":"Which SQL commands manage rights and which rights can be granted?","a":["GRANT (optionally with permission to re-grant) and REVOKE. Rights: SELECT, INSERT, UPDATE, DELETE, REFERENCES."]},{"c":5,"t":"Database access control","q":"How does cascading revocation decide which grants survive?","a":["A grant stays valid only if the granter still holds the right through a valid, earlier grant (or is the owner)."],"d":"Method: for each remaining grant G→H at time t, check that G is the owner or still holds the right through a valid grant with an EARLIER timestamp. Remove grants that fail. Repeat until nothing changes.","n":"This rule is my own assumption, not stated on the slides. It matched all 5 revocation scenarios in the semester test when checked, but confirm against your lecturer's wording."},{"c":5,"t":"Database access control","q":"What are the three database roles, and what does each do?","a":["Application owner: owns the DB objects of an application.","End user: operates through an application and owns nothing.","Administrator: responsible for part or all of the database."]},{"c":5,"t":"Database access control","q":"What are the MS SQL Server fixed roles?","a":["sysadmin, securityadmin, db_owner, db_datareader / db_datawriter, db_denydatareader / db_denydatawriter."]},{"c":5,"t":"Inference","q":"What is an inference attack on a database?","a":["Figuring out forbidden data by combining the results of several ALLOWED queries."]},{"c":5,"t":"Inference","q":"Compare the two ways of detecting inference.","a":["At database design time: change the structure or access control up front. Often too strict and lowers availability.","At query time: detect the violation as queries run and deny or alter them. More flexible but harder to build."]},{"c":5,"t":"Database encryption","q":"Why is database encryption described as the last line of defence?","a":["A database is the richest, most concentrated target, so if other defences fail, encryption still protects the data."]},{"c":5,"t":"Database encryption","q":"What are the challenges of encrypting a database?","a":["Key management overhead (many keys), and inflexibility: searching and indexing get harder. Searching encrypted data means decrypting first (costly); an index over encrypted data helps."]},{"c":5,"t":"Data center security","q":"What is a data center?","a":["An enterprise facility (from a room to a building) that houses IT infrastructure, such as cloud, search engines and research systems."]},{"c":5,"t":"Data center security","q":"Name the four layers of the data center security model (Fig 5.12) and give example controls for each.","a":["Data: encryption, password policy, masking, retention (ISO 27002).","Network: firewalls, anti-virus, IDS/IPS, authentication.","Physical: surveillance, mantraps, 2/3-factor authentication, zones (ISO 27001/27002).","Site: setbacks, redundant utilities, buffer zones, crash barriers, controlled entry."],"r":"CH5 Fig 5.12","n":"The friend's second layer was \"Application\". The slide figure says Network."},{"c":5,"t":"Data center security","q":"What does the TIA-942 standard specify?","a":["Minimum telecommunications infrastructure requirements for data centers (hosting, distribution, environmental control, cabling)."]},{"c":5,"t":"Data center security","q":"Describe the four data center tiers.","a":["Tier 1: single path, no redundancy, shut down for maintenance.","Tier 2: single path plus some redundant components.","Tier 3: multiple paths, ONE active; maintenance without disruption.","Tier 4: multiple ACTIVE paths; survives a worst-case event."],"d":"Higher tier = more redundancy = less downtime."},{"c":5,"t":"Data center security","q":"What are the availability and yearly downtime of each data center tier (Table 5.4)?","a":["Tier 1: 99.671% (28.8 h). Tier 2: 99.741% (22.0 h). Tier 3: 99.982% (1.6 h). Tier 4: 99.995% (0.4 h)."],"r":"CH5 Table 5.4","n":"Percentages and downtime hours read from the slide image of Table 5.4."},{"c":6,"t":"What is malware?","q":"How does NIST define malware?","a":["A program inserted covertly into a system to compromise the confidentiality, integrity or availability of the victim's data, applications or OS, or just to annoy the victim."]},{"c":6,"t":"What is malware?","q":"What two questions can be used to describe any malware?","a":["How does it SPREAD (propagation: infect content, exploit vulnerabilities, social engineering)? What does it DO (payload: corrupt, make a bot, steal information, stay hidden)?"]},{"c":6,"t":"Classification","q":"Which malware needs a host program and which is independent?","a":["Needs a HOST program (parasitic): virus. Independent: worm, trojan, bot."]},{"c":6,"t":"Classification","q":"Which malware replicates and which does not?","a":["Replicates: virus and worm. Does NOT replicate: trojan and spam."]},{"c":6,"t":"Classification","q":"What is an attack kit? Name examples.","a":["A toolkit that lets novices build malware, e.g. Zeus, Angler, Metasploit."]},{"c":6,"t":"Classification","q":"Define: downloader, exploit, logic bomb, keylogger, spyware, zombie/bot, flooder.","a":["Downloader: installs bigger malware.","Exploit: code for one specific vulnerability.","Logic bomb: waits for a condition, then fires.","Keylogger: captures keystrokes.","Spyware: monitors the user.","Zombie/bot: attacks others on command.","Flooder: a DoS client."]},{"c":6,"t":"APT","q":"What does APT stand for and what are its characteristics?","a":["Advanced Persistent Threat. Well-resourced, often state-sponsored, and targets ONE organisation for a long time to steal intellectual property or infrastructure data.","Advanced = many tools. Persistent = never gives up. Threat = humans are behind it."],"d":"Like a patient burglar casing ONE house."},{"c":6,"t":"APT","q":"Name examples of APTs and the techniques they use.","a":["Examples: Aurora, RSA, APT1, Stuxnet. Techniques: spear-phishing, drive-by downloads, watering hole."]},{"c":6,"t":"Viruses","q":"What is a computer virus and what are its three components?","a":["It infects a program by modifying it to include a copy of itself, and runs when the host runs. Components: infection mechanism, trigger (logic bomb) and payload."]},{"c":6,"t":"Viruses","q":"What are the four phases of a virus life cycle?","a":["Dormant (idle) → Propagation (copies itself) → Triggering (an event activates it) → Execution (payload runs)."],"d":"Memory aid: \"Dogs Prefer Treats Eagerly\"."},{"c":6,"t":"Viruses","q":"How are viruses classified by target and by concealment?","a":["By target: boot sector, file infector, macro, multipartite.","By concealment: encrypted, stealth, polymorphic, metamorphic."],"d":"Macro viruses infect DOCUMENTS and are platform independent (Melissa, 1998)."},{"c":6,"t":"Viruses","q":"What is the difference between a polymorphic and a metamorphic virus?","a":["Polymorphic mutates its APPEARANCE on each infection. Metamorphic rewrites itself completely (code AND behaviour)."],"d":"Same person in new clothes versus a new person each time."},{"c":6,"t":"Worms","q":"What is the difference between a worm and a virus?","a":["A worm runs independently and copies a COMPLETE version of itself across networks. A virus hitchhikes inside a host file."]},{"c":6,"t":"Worms","q":"How do worms replicate?","a":["Via email/IM, remote execution, or remote login."]},{"c":6,"t":"Worms","q":"What are the four worm target-discovery strategies?","a":["Random (random IPs, lots of noisy traffic); hit-list (fast, stealthy); topological (uses victim information such as address books); local subnet (behind a firewall, scans its own LAN)."]},{"c":6,"t":"Worms","q":"What shape does the spread of a worm follow over time?","a":["An S-curve: slow start, fast spread, slow finish."]},{"c":6,"t":"Worms","q":"Match the famous worms to their dates and traits: Morris, Code Red, Slammer, WannaCry.","a":["Morris (1988): UNIX, password cracking, finger bug, debug trapdoor in mail.","Code Red (2001): IIS buffer overflow.","Slammer (2003): SQL Server overflow, spread very fast.","WannaCry (2017): ransomware worm using an SMB flaw, with a kill switch."],"d":"Other dates: Melissa 1998, Nimda 2001, Mydoom 2004, Conficker 2008, Stuxnet 2010. Mobile worms: Cabir 2004, Lasco, CommWarrior (Bluetooth/MMS)."},{"c":6,"t":"Client-side attacks","q":"What is mobile code?","a":["Code such as Java applets, ActiveX, JavaScript and VBScript that is shipped unchanged to many platforms and runs there."]},{"c":6,"t":"Client-side attacks","q":"What is the difference between a drive-by download, a watering hole attack and malvertising?","a":["Drive-by download: just visiting a page installs malware (browser or plugin flaw), aimed at any visitor.","Watering hole: compromise the site YOUR TARGET visits, then wait.","Malvertising: paid ads carrying malware on legitimate sites. The site itself is NOT compromised."]},{"c":6,"t":"Client-side attacks","q":"What is clickjacking?","a":["Hidden frames trick you into clicking something you cannot see."]},{"c":6,"t":"Payloads","q":"What are examples of a corruption payload?","a":["Ransomware (encrypts files and demands payment, e.g. WannaCry; backups are the recovery), the Chernobyl virus (rewrites the BIOS = physical damage), Stuxnet (industrial sabotage), and logic bombs (explode when a condition is met)."]},{"c":6,"t":"Payloads","q":"What is a bot, what is a botnet, and what are they used for?","a":["A bot takes over an Internet computer to launch attacks; a botnet is a coordinated collection of bots. Uses: DDoS, spam, sniffing, keylogging, spreading malware, adware, manipulating polls and games."]},{"c":6,"t":"Payloads","q":"How are bots remotely controlled?","a":["IRC channel commands (classic), HTTP covert channels, or P2P (no single point of failure)."],"d":"Remote control is what separates a bot from a worm."},{"c":6,"t":"Payloads","q":"What is the difference between phishing and spear-phishing?","a":["Phishing: spam email pointing to a fake bank or login site (a net). Spear-phishing: a researched, personalised email aimed at one person (a spear)."]},{"c":6,"t":"Payloads","q":"What do keyloggers and spyware do?","a":["Keylogger: captures keystrokes and filters for words like \"login\" or \"password\". Spyware: monitors browsing and redirects to fake sites."]},{"c":6,"t":"Payloads","q":"What is the difference between a backdoor and a rootkit?","a":["A backdoor (trapdoor) is a secret entry that bypasses security. A rootkit is a set of HIDDEN tools installed after root access that hides processes, files and registry entries."],"d":"A maintenance hook is a backdoor left by programmers for debugging."},{"c":6,"t":"Payloads","q":"List the classes of rootkit.","a":["Persistent (survives reboot), memory-based (RAM only), user mode (intercepts APIs), kernel mode (alters the system call table, e.g. knark), virtual-machine based (thin hypervisor), external mode (BIOS / SMM)."]},{"c":6,"t":"Countermeasures","q":"What is the order of defence against malware?","a":["PREVENTION first (policy, awareness, vulnerability mitigation, threat mitigation). If that fails: detect → identify → remove."]},{"c":6,"t":"Countermeasures","q":"What are the four generations of anti-virus software?","a":["1st: signature scanners (known malware only). 2nd: heuristic (rules, checksums). 3rd: activity traps (watch ACTIONS). 4th: full-featured (all combined plus access control)."],"d":"Memory aid: S-H-A-F."},{"c":6,"t":"Countermeasures","q":"How does sandbox analysis work and what is it good against?","a":["Run the suspect code in an emulator and watch its behaviour. Good against polymorphic and metamorphic malware."]},{"c":6,"t":"Countermeasures","q":"What are the pros and cons of behaviour blocking?","a":["Pro: real-time monitoring of actions. Con: the malware must RUN first before it can be blocked, and false positives happen."]},{"c":6,"t":"Countermeasures","q":"What are ingress and egress monitors in perimeter scanning?","a":["Ingress monitors sit at the enterprise ↔ Internet border. Egress monitors sit at LAN borders (including honeypot-style traffic to unused IPs)."]},{"c":6,"t":"Countermeasures","q":"What did Practical 5 cover?","a":["Problem 6.2 (can program D decide whether a program is a virus?) and 6.3 (a metamorphic code sequence with dummy instructions)."]},{"c":7,"t":"What is DoS?","q":"What is a denial-of-service attack, and which CIA property does it target?","a":["An action that PREVENTS or IMPAIRS authorised use of networks, systems or applications by exhausting resources (CPU, memory, bandwidth, disk). It attacks AVAILABILITY."]},{"c":7,"t":"What is DoS?","q":"What three kinds of resource can a DoS attack exhaust, and what attacks match each?","a":["Network bandwidth: ping flood, UDP flood.","System resources: SYN spoofing (OS network code, tables).","Application resources: HTTP flood, Slowloris."],"d":"Analogy: a jammed road, an overloaded till, cashiers stuck on one fake customer."},{"c":7,"t":"Classic DoS","q":"What is a flooding ping attack?","a":["Overwhelming the link capacity of the target with ping traffic. The attacker is identifiable unless the source is spoofed."]},{"c":7,"t":"Classic DoS","q":"Why do attackers use source address spoofing?","a":["A forged source address (raw sockets) makes the attack hard to trace."]},{"c":7,"t":"Classic DoS","q":"What is backscatter?","a":["Replies landing at innocent addresses. Spoofed packets make the victim reply to random third parties. Defenders can watch backscatter to spot attacks."],"n":"The defender-side observation is general knowledge; the slides define backscatter only as the stray replies."},{"c":7,"t":"SYN spoofing","q":"What are the three steps of the TCP three-way handshake?","a":["SYN (client) → SYN-ACK (server) → ACK (client), then the connection is established."]},{"c":7,"t":"SYN spoofing","q":"How does a SYN spoofing attack work?","a":["The attacker floods SYNs with FORGED source addresses. The server sends SYN-ACKs to the fake addresses and holds half-open entries waiting for an ACK that never comes. The connection table fills up, so real users are refused."],"d":"Analogy: 1000 fake reservations hold every table for nobody. SYN spoofing attacks the connection table and is the most common attack of this type."},{"c":7,"t":"Flooding attacks","q":"What is the aim of a flooding attack, and what types are there?","a":["Overload network capacity with VOLUME. ICMP flood (echo requests), UDP flood (packets to a port on the target), TCP SYN flood (TCP packets to the target)."],"d":"Any packet type works. Ping is allowed in as a diagnostic tool, which is why ICMP floods work."},{"c":7,"t":"DDoS","q":"What is a DDoS attack and what is its structure?","a":["Many systems (a botnet of zombies) attack at once. Chain: Attacker → Handlers → Zombies (agents) → Target."]},{"c":7,"t":"DDoS","q":"Why do attackers prefer DDoS over a single-source attack?","a":["It needs less attacker bandwidth and is harder to trace."]},{"c":7,"t":"DDoS","q":"What is a SIP flood?","a":["A flood of INVITE requests that overwhelms the SIP proxy (VoIP signalling)."]},{"c":7,"t":"HTTP-based attacks","q":"What is an HTTP flood and what is spidering?","a":["An HTTP flood sends lots of HTTP requests at a web server. Spidering is bots following ALL links on a site recursively to generate requests."]},{"c":7,"t":"HTTP-based attacks","q":"How does Slowloris work and why can signature-based IDS/IPS miss it?","a":["It sends partial HTTP requests that NEVER complete, hogging every request-handling thread until capacity is exhausted. It looks legitimate, so signature-based IDS/IPS misses it."],"d":"A flood is shouting; Slowloris is mumbling and never finishing."},{"c":7,"t":"Reflection and amplification","q":"What is a reflection attack?","a":["The attacker spoofs the TARGET's address as the source, so an intermediary (the reflector) replies to the target."]},{"c":7,"t":"Reflection and amplification","q":"What is DNS amplification?","a":["A small DNS query (with the target's spoofed address) produces a MUCH larger response sent to the target."]},{"c":7,"t":"Reflection and amplification","q":"What is the defence against reflection and amplification?","a":["Block spoofed source addresses."]},{"c":7,"t":"Defence","q":"What are the four lines of defence against DoS?","a":["1. Prevention & pre-emption (before): policies, firewalls, block spoofing.","2. Detection & filtering (during).","3. Traceback & identification (the ISP traces the source).","4. Reaction (after): eliminate the cause and update the response plan."]},{"c":7,"t":"Defence","q":"Why can DoS never be fully prevented?","a":["High traffic may be legitimate, such as a flash crowd, so you cannot simply block it."]},{"c":7,"t":"Defence","q":"Where should spoofed source addresses be blocked?","a":["At routers as close to the source as possible, checking that the path back to the source is valid."]},{"c":7,"t":"Defence","q":"How do SYN cookies defend against SYN spoofing?","a":["The server encodes a cryptographic cookie into the initial sequence number instead of storing a half-open entry. It stores nothing for a half-open connection, so there is no table to fill. Old half-open entries are dropped when the table overflows."]},{"c":7,"t":"Defence","q":"What other prevention methods does the course list?","a":["Block IP-directed broadcasts and suspicious services; CAPTCHA to separate humans from bots (application attacks); mirrored or replicated servers for high availability. Routes cannot be encrypted, so rely on filtering."]},{"c":7,"t":"Defence","q":"What steps are taken when responding to a DoS attack?","a":["Before: have an incident response plan (ISP contacts, monitors, IDS). Then identify the TYPE of attack, capture and analyse packets, design filters or fix the bug, have the ISP trace the flow back (slow, but needed for legal action), use contingency (backup servers, new site or addresses), and afterwards analyse and update the plan."]},{"c":8,"t":"Intruders","q":"What are the main classes of intruder?","a":["Cyber criminals (financial reward, identity theft, data theft), activists/hacktivists (social or political cause, often low skill), state-sponsored (espionage or sabotage, highly skilled), and others (hobbyists, curiosity)."]},{"c":8,"t":"Intruders","q":"What are the three skill levels of intruder and which is hardest to stop?","a":["Apprentice: USES existing toolkits (most numerous, EASIEST to stop).","Journeyman: MODIFIES and extends tools.","Master: FINDS new vulnerabilities and MAKES tools (HARDEST to stop)."]},{"c":8,"t":"Intruders","q":"What are the stages of a typical intrusion?","a":["1. Information gathering (DNS, WHOIS, NMAP, probing services). 2. Initial access (brute-force password, plugin exploit, spear-phishing). 3. Privilege escalation (local exploits, sniffers for admin passwords). 4. Gather/exploit (find data, transfer documents out). 5. Maintain access (rootkit, remote admin tool, disable AV/IDS). 6. Cover tracks (hide files, edit logs)."],"d":"Memory aid: \"I Always Plan Great Mischief, Carefully\"."},{"c":8,"t":"IDS basics","q":"What is intrusion detection?","a":["Gathering and analysing information to identify possible intrusions."]},{"c":8,"t":"IDS basics","q":"What are the three components of an IDS and what does each do?","a":["Sensors COLLECT data. Analyzers DECIDE whether an intrusion occurred. The user interface shows output and controls the IDS."]},{"c":8,"t":"IDS basics","q":"What are HIDS, NIDS and distributed/hybrid IDS?","a":["HIDS monitors one host. NIDS monitors network traffic and protocols. Distributed/hybrid uses many sensors with central analysis."]},{"c":8,"t":"IDS basics","q":"What are the requirements for an IDS?","a":["Run continually, fault tolerant, resist subversion, minimal overhead, configurable to policy, adapt to changes, scale well, graceful degradation, dynamic reconfiguration."]},{"c":8,"t":"IDS basics","q":"How can an IDS itself cause denial of service?","a":["Cutting off the intruder may cut off ALL users."]},{"c":8,"t":"Analysis approaches","q":"Compare signature-based and anomaly-based detection.","a":["Signature / heuristic (rule-based): matches known-bad patterns; FAST; cannot detect an attack without a signature.","Anomaly: learns NORMAL behaviour and flags deviations; slower with a learning curve, but catches NEW attacks."],"d":"Signature is a wanted poster; anomaly is a bouncer who knows the regulars."},{"c":8,"t":"Analysis approaches","q":"What is the big problem with anomaly detection?","a":["FALSE POSITIVES: legitimate unusual behaviour is flagged as an attack."]},{"c":8,"t":"Analysis approaches","q":"What types of anomaly detection exist?","a":["Statistical, knowledge-based (expert rules), and machine learning."]},{"c":8,"t":"Host-based IDS","q":"What data sources does a HIDS use?","a":["System call traces (OS calls made by a process); audit/log records (Windows/Linux logs); file integrity checksums (hashing: malware changes the hash); and registry access (Windows registry changes)."]},{"c":8,"t":"Host-based IDS","q":"How does a distributed HIDS work?","a":["Agents on each host report to a central manager."]},{"c":8,"t":"Network-based IDS","q":"What does a NIDS monitor?","a":["Traffic at selected points in the network, in near real time, including protocol activity."]},{"c":8,"t":"Network-based IDS","q":"What is the difference between an inline and a passive NIDS sensor?","a":["Inline: sits IN the traffic path and can block, but risks becoming a bottleneck.","Passive: monitors a COPY of the traffic (a tap), so there is no performance hit."]},{"c":8,"t":"Network-based IDS","q":"What is stateful protocol analysis?","a":["Comparing traffic to benign protocol profiles while tracking protocol states. It is heavy on resources."]},{"c":8,"t":"Network-based IDS","q":"What does a NIDS alert log contain and which format is standard for exchanging alerts?","a":["Timestamp, session ID, type, protocols, IPs/ports, bytes and payload. IDMEF is the standard alert exchange format."]},{"c":8,"t":"Honeypots","q":"What is a honeypot and why is any use of it suspicious?","a":["A decoy system with fabricated information and NO production value, so any use of it is suspicious."]},{"c":8,"t":"Honeypots","q":"What are the purposes of a honeypot?","a":["Divert attackers from critical systems, collect information about them, and keep them busy until admins can respond."]},{"c":8,"t":"Honeypots","q":"What is the difference between low-interaction and high-interaction honeypots?","a":["Low interaction: emulates a few services; low risk.","High interaction: real systems; richer data but more risk."]},{"c":8,"t":"Snort","q":"What is Snort?","a":["An open-source, lightweight, rule-based NIDS / IPS."]},{"c":8,"t":"Snort","q":"What are the parts of a Snort rule?","a":["A HEADER (action, protocol, source address and port, direction, destination address and port) followed by OPTIONS in brackets."],"r":"CH8 S41"},{"c":8,"t":"Snort","q":"What are the eight Snort rule actions (Table 8.3)?","a":["alert (alert, then log), log, pass (ignore), activate (alert, then turn on a dynamic rule), dynamic (idle until activated, then log), drop (iptables drops and logs), reject (drop and log, then send TCP reset or ICMP port unreachable), sdrop (drop without logging)."],"r":"CH8 S42"},{"c":8,"t":"Snort","q":"Read this Snort rule: alert tcp any any -> 192.168.1.0/24 80 (msg:\"web probe\"; content:\"/etc/passwd\";)","a":["Action = alert; protocol = tcp; source = any address, any port; direction = ->; destination = 192.168.1.0/24 port 80; options = message \"web probe\" and content match \"/etc/passwd\"."],"n":"This sample rule is mine to show the layout. It is not from the slides."},{"c":8,"t":"Snort","q":"What did the IDS practical require?","a":["A virtual honeypot demo, submitted as a screen video showing your name and student number."]},{"c":9,"t":"The need for firewalls","q":"What does a firewall do?","a":["It is a controlled link between the premises network and the Internet: a single choke point that imposes perimeter defence, security and auditing."]},{"c":9,"t":"The need for firewalls","q":"What are the three design goals of a firewall?","a":["1. ALL traffic (in and out) must pass through it. 2. ONLY authorised traffic (defined by policy) may pass. 3. The firewall itself is IMMUNE to penetration (hardened system, secure OS)."]},{"c":9,"t":"The need for firewalls","q":"What can a firewall filter on?","a":["IP address and protocol values; application protocol (gateways); user identity (inside users authenticated); network activity (time, rate of requests)."]},{"c":9,"t":"The need for firewalls","q":"What can a firewall provide beyond filtering?","a":["A single choke point, a location for monitoring security events, a platform for non-security Internet functions (NAT, logging), and a platform for IPSec (VPN)."]},{"c":9,"t":"The need for firewalls","q":"What can a firewall NOT protect against?","a":["Attacks that BYPASS it; internal threats (not fully effective); an improperly secured WLAN accessed from outside; and infected portable storage or laptops brought in (BYOD)."]},{"c":9,"t":"Packet filtering","q":"How does a packet filtering firewall decide?","a":["Rules are applied to EACH IP packet using the IP/TCP header (source/destination IP, ports, protocol field). It has no memory: each packet is judged alone."]},{"c":9,"t":"Packet filtering","q":"What is the difference between a default DISCARD and a default FORWARD policy, and which is safer?","a":["DISCARD: prohibit unless permitted (SAFER). FORWARD: permit unless prohibited."]},{"c":9,"t":"Packet filtering","q":"What are the advantages and disadvantages of packet filters?","a":["Advantages: simple, transparent, very fast.","Disadvantages: cannot stop application-specific attacks, limited logging, no advanced user authentication, vulnerable to TCP/IP spoofing."]},{"c":9,"t":"Stateful inspection and gateways","q":"How does a stateful inspection firewall differ from a packet filter?","a":["A stateful firewall remembers the conversation: it keeps a directory of outbound TCP connections (one entry each), allows incoming traffic to high ports ONLY if it matches an entry, and tracks TCP sequence numbers. A packet filter has no memory."]},{"c":9,"t":"Stateful inspection and gateways","q":"How does an application-level gateway (proxy) work, and what is the trade-off?","a":["It relays application traffic: User → gateway (user authenticated) → application. It needs proxy code for EACH application and is more secure, but adds processing overhead per connection."],"d":"Like reading the letter."},{"c":9,"t":"Stateful inspection and gateways","q":"How does a circuit-level gateway work?","a":["It relays TCP segments from one connection to another WITHOUT examining the contents. It checks that the handshake is legitimate, NOT the payload. SOCKS v5 is a common framework."],"d":"Like checking the envelope only."},{"c":9,"t":"Firewall basing and topology","q":"What are a bastion host, a host-based firewall and a personal firewall?","a":["Bastion host: a critical, hardened strong point on the network boundary that runs proxies.","Host-based firewall: secures an individual host; rules specific to that host; independent of network topology.","Personal firewall: controls traffic between a PC and the Internet; denies unauthorised INBOUND access."]},{"c":9,"t":"Firewall basing and topology","q":"What is a DMZ?","a":["A demilitarised zone: a segment between the Internet and the internal network that holds externally visible servers (web, email, DNS)."],"d":"The public can enter the lobby, but staff rooms are behind another door."},{"c":9,"t":"Firewall basing and topology","q":"What is a VPN in the firewall context?","a":["IPSec in firewalls/routers, giving encrypted tunnels across the Internet between sites or from a remote user."]},{"c":9,"t":"Firewall basing and topology","q":"List the firewall configurations from the course.","a":["Host-resident firewall, screening router, single bastion inline, single bastion T, double bastion inline / T, distributed firewall."]},{"c":9,"t":"Intrusion prevention (IPS)","q":"What is an IPS and how does it differ from an IDS and a firewall?","a":["An IPS extends IDS so it can BLOCK detected malicious activity. It blocks traffic like a firewall but uses IDS-style algorithms to decide."],"d":"IDS is a camera; IPS is a guard."},{"c":9,"t":"Intrusion prevention (IPS)","q":"What is a host-based IPS (HIPS) and what does it detect?","a":["It typically protects desktops. Signature: malicious patterns in application network traffic or system-call sequences. Anomaly: behaviour patterns that indicate malware, such as privilege escalation, buffer overflow or modifying system resources."]},{"c":9,"t":"Intrusion prevention (IPS)","q":"What is the sandbox approach in a HIPS?","a":["Quarantine code in an isolated area, run it and monitor its behaviour."]},{"c":9,"t":"Intrusion prevention (IPS)","q":"What is a network-based IPS (NIPS)?","a":["A dedicated device at the network boundary: an inline NIDS with authority to modify or discard packets and tear down TCP connections."]},{"c":9,"t":"Intrusion prevention (IPS)","q":"What detection methods does a NIPS use?","a":["Pattern matching (known byte sequences); stateful matching (a signature in the context of the traffic STREAM); protocol anomaly (compared with standard protocol definitions); traffic anomaly (unusual traffic activity); statistical anomaly (profiles of normal traffic; flag deviations)."]},{"c":9,"t":"UTM, Snort Inline, immune system","q":"What is a UTM?","a":["Unified Threat Management: a single appliance with firewall, VPN, anti-spam, web filtering, bandwidth shaping and intrusion prevention."]},{"c":9,"t":"UTM, Snort Inline, immune system","q":"What does the REPLACE option in Snort Inline do and why is it useful in a honeypot?","a":["It modifies packets rather than dropping them. In a honeypot the attacker sees the attack fail and cannot work out why."]},{"c":9,"t":"UTM, Snort Inline, immune system","q":"What is the digital immune system?","a":["A comprehensive defence against malware that propagates faster, with a GLOBAL view. It depends on malware analysis that can detect NEW strains."],"d":"Flow (Fig 9.5): sensors detect, forward to analysis, sandbox, produce a patch, update clients."},{"c":10,"t":"What is it?","q":"What is a buffer overflow?","a":["A programming ERROR where more data is written into a fixed-size buffer than it can hold, overwriting adjacent memory (NIST)."],"d":"A 2-litre bottle poured into a 1-litre glass: the spill hits whatever sits next to it."},{"c":10,"t":"What is it?","q":"Where can the overflowing buffer be located?","a":["On the stack, on the heap, or in global data."]},{"c":10,"t":"What is it?","q":"What are the possible consequences of a buffer overflow?","a":["Corruption of program data; unexpected transfer of control; memory access violation; execution of ATTACKER-CHOSEN code."]},{"c":10,"t":"What is it?","q":"Why does strcpy(destination, source) overflow when source is \"username12\" and destination holds 7 bytes?","a":["\"username12\" is 10 characters + a null = 11 bytes, but destination[7] holds only 6 characters + null. strcpy copies with no length check, so the 4 extra bytes land in whatever sits next to the destination buffer."],"r":"CH10 S7"},{"c":10,"t":"What is it?","q":"How do attackers find vulnerable programs?","a":["By inspecting source code for unsafe functions, by tracing execution with oversized input, or by fuzzing (automatic random or oversized input)."]},{"c":10,"t":"Languages and memory","q":"Which programming languages are vulnerable to buffer overflows and which are not?","a":["C and similar languages are VULNERABLE (efficiency over safety, legacy unsafe code). Java and Python (modern high-level languages) are NOT, because they check ranges, at a run-time cost."]},{"c":10,"t":"Languages and memory","q":"Which direction does the stack grow, and which direction does a buffer write run?","a":["The stack sits at the top and grows DOWN toward lower addresses (the heap grows UP). But a write into a buffer runs from LOW to HIGH addresses, which is what reaches the return address."],"r":"CH10 S14 (Fig 10.4)","n":"The friend wrote \"data written from HIGHER to LOWER addresses\". That mixes two things: the stack GROWS toward lower addresses, but a buffer write runs from LOW to HIGH."},{"c":10,"t":"Stack buffer overflow","q":"What is the layout of a stack frame, from high to low address?","a":["Parameters, return address, old (saved) frame pointer, local variables / buffer."]},{"c":10,"t":"Stack buffer overflow","q":"How does a stack buffer overflow attack take control of a program?","a":["The attacker writes past the end of the buffer, overwrites the saved frame pointer and then the RETURN ADDRESS, so the function returns into attacker code."],"d":"Like rewriting the \"go back to\" sticky note to say \"go to MY code\". The buffer sits BELOW the return address and writes go low → high. The Morris worm used this."},{"c":10,"t":"Shellcode","q":"What is shellcode?","a":["Code SUPPLIED BY THE ATTACKER, often stored in the overflowed buffer. Traditionally it gives a shell with the program's privileges."]},{"c":10,"t":"Shellcode","q":"Why is shellcode processor and OS specific, and what must it be?","a":["It is machine code, so it is tied to the processor and OS. It must be position independent, since it cannot assume where it is loaded."]},{"c":10,"t":"Shellcode","q":"What is a NOP sled?","a":["A run of no-op instructions placed before the shellcode so that an imprecise return address still lands on the code."]},{"c":10,"t":"Unsafe C routines","q":"Which unsafe C functions should be avoided and what replaces them?","a":["gets → fgets. strcpy → strncpy or strlcpy. strcat → strncat or strlcat. sprintf → snprintf. scanf / fscanf → use a width limit."]},{"c":10,"t":"History","q":"Which famous attacks used buffer overflows?","a":["1988 Morris worm (fingerd); 1996 Aleph One, \"Smashing the Stack for Fun and Profit\"; 2001 Code Red (IIS); 2003 Slammer (SQL Server); 2004 Sasser (LSASS). Still a concern because of legacy buggy code and careless programmers."]},{"c":10,"t":"Compile-time defences","q":"What are the compile-time defences against buffer overflow?","a":["Use a modern high-level language with range checks (cost: run-time checks and no low-level access); safe coding (inspect and rewrite unsafe code); safe libraries such as Libsafe (loaded before the standard libraries; needs recompiling); and stack protection (Stackguard canary, Stackshield / RAD)."]},{"c":10,"t":"Compile-time defences","q":"How does a Stackguard canary protect the return address?","a":["A canary value is placed next to the return address, and a changed canary aborts the program. An overflow must trample the canary BEFORE it reaches the return address. The canary must be unpredictable."],"d":"Canary in the coal mine."},{"c":10,"t":"Compile-time defences","q":"How do Stackshield and RAD protect the return address?","a":["They keep a COPY of the return address in safe memory and compare it on function exit."]},{"c":10,"t":"Run-time defences","q":"What is the difference between compile-time and run-time defences?","a":["Compile-time defences harden NEW programs. Run-time defences detect and ABORT attacks in EXISTING programs."]},{"c":10,"t":"Run-time defences","q":"How does a non-executable address space stop buffer overflow attacks?","a":["Stack and heap are marked non-executable (MMU support), so injected shellcode cannot run."]},{"c":10,"t":"Run-time defences","q":"What is ASLR?","a":["Address space layout randomisation: a random shift of the locations of stack, heap, global data and libraries for each process, so the attacker cannot predict addresses."]},{"c":10,"t":"Run-time defences","q":"What are guard pages?","a":["Illegal pages placed between memory regions. Any access to one aborts the process. The cost is the extra page mappings."]},{"c":10,"t":"Other overflow types","q":"Describe the replacement stack frame and return-to-system-call attacks and their defences.","a":["Replacement stack frame: the overflow also replaces the frame pointer and the attacker supplies a fake frame. Defence: stack protection.","Return to system call: the return address points to an existing library function (e.g. system()) with attacker arguments; works on non-executable stacks. Defence: ASLR, block unsafe functions."]},{"c":10,"t":"Other overflow types","q":"Describe heap overflow and global data overflow attacks and their defences.","a":["Heap overflow: a buffer in the heap (no return address); overwrites heap data or function pointers. Defence: non-executable or randomised heap.","Global data overflow: overwrites a function pointer in global data. Defence: randomise, guard pages, move pointers."]},{"c":11,"t":"Big picture","q":"What are the five critical web-application flaws named in the course?","a":["Unvalidated input, cross-site scripting (XSS), buffer overflow, injection flaws, and improper error handling."],"d":"Root cause: INSUFFICIENT checking and validation of data and error codes."},{"c":11,"t":"Big picture","q":"What are the three CWE/SANS Top 25 error buckets?","a":["1. Insecure interaction between components (SQLi, XSS, CSRF).","2. Risky resource management (buffer overflow, path traversal, integer overflow).","3. Porous defences (missing authentication or encryption, hard-coded credentials)."],"d":"Memory aid: I-R-P.","r":"CH11 Table 11.1","n":"Full category lists read from the Table 11.1 slide image (CWE/SANS Top 25, 2011)."},{"c":11,"t":"Big picture","q":"What are the three goals of NISTIR 8151?","a":["STOP vulnerabilities before they occur (better methods), FIND them before they are exploited (testing, scanners), and REDUCE their impact (resilient architecture)."]},{"c":11,"t":"Big picture","q":"What is the difference between reliability and security when handling input?","a":["Reliability deals with ACCIDENTAL failure and random input. Security deals with DELIBERATE exploitation, where the attacker picks the input."],"d":"A clumsy person tripping versus a burglar going for the loose window."},{"c":11,"t":"Defensive programming","q":"What is defensive programming?","a":["Writing software that keeps working even under attack or error. Zero-based trust: never assume anything, validate every assumption and handle every error state."],"d":"It conflicts with business pressure for short development time. Use checklists and design security in from the start (SAFECode)."},{"c":11,"t":"Handling program input","q":"What counts as program input and how should it be treated?","a":["Any data from outside the program, and ALL of it should be treated as dangerous."]},{"c":11,"t":"Handling program input","q":"Why is the assumed size of input a security problem?","a":["If the program assumes a maximum size but does not check it, the result is a buffer overflow."],"d":"Heartbleed (2014) was caused by an unchecked length field."},{"c":11,"t":"Handling program input","q":"Why is an ALLOW-list better than a deny-list for validating input syntax?","a":["An allow-list accepts only known-good input, so anything unexpected is rejected. A deny-list can miss bad input nobody thought of."]},{"c":11,"t":"Handling program input","q":"What is canonicalisation and why does input need it?","a":["Converting input to ONE standard form before checking. Alternate encodings (Unicode / UTF-8) can hide bad characters from a check."]},{"c":11,"t":"Numeric input and fuzzing","q":"In the signed/unsigned example, why does length 186 + 1 = 187 stored in 8 bits (10111011) bypass the check if (size <= 50)?","a":["Read as unsigned it is 187, but read as signed the top bit makes it NEGATIVE, and a negative number passes <= 50 even though the real input is huge."],"d":"Two's complement gives 187 − 256 = −69. Sign-magnitude gives −59 (the slide's value). Either way the number is negative.","n":"Both −69 and −59 are right under different signed formats. The point is that a negative passes <= 50."},{"c":11,"t":"Numeric input and fuzzing","q":"How do you fix this kind of numeric-type bug?","a":["Use consistent types and validate ranges, including negatives."]},{"c":11,"t":"Numeric input and fuzzing","q":"What is fuzzing, and what are its strengths and limits?","a":["Feeding randomly generated input to find crashes (Barton Miller, 1989). Cheap and assumption-free, but it misses some bugs, so combine it with other approaches."]},{"c":11,"t":"Injection attacks","q":"What do all injection attacks have in common?","a":["Input data influences the FLOW OF EXECUTION of the program."]},{"c":11,"t":"Injection attacks","q":"What is SQL injection in terms of software security and how is it prevented?","a":["User input is pasted into an SQL statement and the attacker extends it (for example with ; and another command). Defence: validate/escape input and use prepared statements."]},{"c":11,"t":"Injection attacks","q":"What are PHP code injection and OS command injection?","a":["PHP code injection: include $path.'functions.php' with an attacker-controlled URL in the path. OS command injection: attacker input reaches a shell command."]},{"c":11,"t":"Injection attacks","q":"What is cross-site scripting (XSS) and how is it prevented?","a":["Script input from ONE user is shown to ANOTHER user and runs in their browser. It exploits trust: all content from a site is treated equally. Defence: validate input, escape output."],"d":"Graffiti with a booby-trap on a public wall."},{"c":11,"t":"Writing safe code","q":"What must a developer do to get the algorithm itself correct?","a":["Handle ALL variants, and remove debug and maintenance hooks and easter eggs before release."],"d":"Example from the slides: TCP sequence numbers used as both identifier AND authenticator."},{"c":11,"t":"Writing safe code","q":"Why can machine code differ from the algorithm you wrote, and what addresses this?","a":["A compiler could be hacked. Only high-assurance evaluation (CC level 7) checks this."]},{"c":11,"t":"Writing safe code","q":"What are a memory leak and a race condition?","a":["Memory leak: a steady loss of heap until it is exhausted. Race condition: shared values corrupted without synchronisation; deadlock leads to DoS."]},{"c":11,"t":"Interacting with the OS","q":"Why are environment variables untrusted input?","a":["They are inherited by processes, so a local user can set them to attack a privileged program."]},{"c":11,"t":"Interacting with the OS","q":"What is the principle of least privilege for programs?","a":["Programs that run as root are major targets, so use privilege only when needed and split programs into small modules."]},{"c":11,"t":"Interacting with the OS","q":"How should shared resources and temporary files be handled safely?","a":["Use a lockfile for shared resources (all programs must cooperate). For temp files, the process ID is predictable, so use RANDOM names."]},{"c":11,"t":"Interacting with the OS","q":"Why must you flush and sync to really shred a file?","a":["Buffering means data may not yet have reached the disk, so you must flush and sync."]},{"c":11,"t":"Handling output","q":"What is the rule for handling output safely?","a":["Validate input AND escape output. Output may be stored, sent or displayed, and one operation's output is another's input, so it must match the EXPECTED form: identify permissible content, filter untrusted data and specify the character set."]},{"c":13,"t":"What is cloud computing?","q":"How does NIST SP 800-145 define cloud computing?","a":["A model for ubiquitous, convenient, ON-DEMAND network access to a SHARED POOL of configurable resources, rapidly provisioned with MINIMAL management effort."],"r":"CH13 S4"},{"c":13,"t":"What is cloud computing?","q":"How many essential characteristics, service models and deployment models does the NIST definition have?","a":["5 essential characteristics, 3 service models, 4 deployment models."],"r":"CH13 S4"},{"c":13,"t":"What is cloud computing?","q":"What are the five essential characteristics of cloud computing?","a":["Broad network access, rapid elasticity, measured service, on-demand self-service, resource pooling."],"n":"These are the NIST SP 800-145 characteristics from general knowledge. The slides state the number five but do not list them."},{"c":13,"t":"What is cloud computing?","q":"What expectations do customers have of cloud computing?","a":["Self-monitoring and self-healing, automation, self service, pay only for what you use, and greater reliability and availability than older technologies. It is still client-server DISTRIBUTED computing; you make it someone else's problem."]},{"c":13,"t":"Service models","q":"What are IaaS, PaaS and SaaS? Give an example of each.","a":["IaaS: virtual hosted servers and machines, pay-as-you-go, self-service. Example: Amazon Web Services.","PaaS: for developers to build apps without buying dev/test/production infrastructure. Examples: Google App Engine, Microsoft Azure.","SaaS: software used daily without thinking. Examples: Gmail, Drive, Office365, Dropbox."]},{"c":13,"t":"Service models","q":"What is the relationship between IaaS, PaaS and SaaS in the CSA reference model?","a":["IaaS ⊂ PaaS ⊂ SaaS: each sits on top of the one below."]},{"c":13,"t":"Service models","q":"Name other \"as a service\" models from the course.","a":["STaaS, SECaaS, DaaS (data / desktop), BPaaS, TEaaS, APIaaS."]},{"c":13,"t":"Servic
